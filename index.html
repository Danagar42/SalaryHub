                    <motion.div initial={{ opacity: 0, scale: 0.95 }} animate={{ opacity: 1, scale: 1 }} exit={{ opacity: 0, height: 0, overflow: 'hidden' }} key={item.id} className="flex flex-col md:flex-row gap-2 bg-slate-50 dark:bg-slate-900/50 p-3 rounded-xl border border-slate-100 dark:border-slate-700/50 transition-colors">
                      <input type="text" placeholder="Вид утримання" value={item.name} onChange={e => { const newArr = [...deductions]; newArr[idx].name = e.target.value; setDeductions(newArr); markDirty(); }} className="w-full md:flex-1 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-800 dark:text-slate-200 rounded-lg p-2.5 text-sm transition-colors" required />
                      <input type="number" step="0.01" inputMode="decimal" placeholder="Сума ₴" value={item.amount} onChange={e => { const newArr = [...deductions]; newArr[idx].amount = e.target.value; setDeductions(newArr); markDirty(); }} className={`w-full md:w-32 bg-white dark:bg-slate-800 border rounded-lg p-2.5 text-sm font-bold font-mono transition-colors ${showTaxWarning && isTax ? 'border-amber-300 dark:border-amber-600 text-amber-700 dark:text-amber-400' : 'border-slate-200 dark:border-slate-700 text-rose-700 dark:text-rose-400'}`} required />
                      <button type="button" onClick={() => removeDeduction(item.id)} className="w-full md:w-auto p-2.5 flex justify-center text-rose-500 bg-rose-50 hover:bg-rose-100 dark:bg-rose-900/20 dark:hover:bg-rose-900/40 rounded-lg transition mt-2 md:mt-0" aria-label="Видалити утримання"><IconTrash /></button>
                    </motion.div>
                  )})}

              </div>
            </div>

            <div className={`bg-slate-800 dark:bg-slate-900 text-white p-4 rounded-2xl shadow-xl border mt-6 ${currentBalance < -1 || currentNet < 0 ? 'border-rose-500 ring-2 ring-rose-500/50' : 'border-slate-700'}`}>
              <div className="grid grid-cols-2 md:grid-cols-4 gap-3 md:gap-4 items-center">
                <div className="flex flex-col">
                  <span className="text-xs text-slate-400">Нараховано:</span>
                  <span className="text-emerald-400 font-bold font-mono tracking-tight text-sm md:text-base">{formatCurrency(currentAccrued, 'UAH')}</span>
                </div>
                <div className="flex flex-col">
                  <span className="text-xs text-slate-400">Податки та збори:</span>
                  <span className="text-rose-400 font-bold font-mono tracking-tight text-sm md:text-base">-{formatCurrency(taxesAndLevies, 'UAH')}</span>
                </div>
                <div className="flex flex-col">
                  <span className="text-xs text-slate-300 font-semibold">Чистий заробіток:</span>
                  <span className={`font-bold font-mono tracking-tight text-sm md:text-base ${currentNet < 0 ? 'text-rose-400' : 'text-emerald-400'}`}>{formatCurrency(currentNet, 'UAH')}</span>
                </div>
                <div className="flex flex-col">
                  <span className="text-xs font-bold text-slate-200">Залишок до виплати:</span>
                  <span className={`text-base md:text-lg font-black font-mono tracking-tight ${currentBalance < -1 ? 'text-rose-400' : 'text-white'}`}>{formatCurrency(currentBalance, 'UAH')}</span>
                </div>
              </div>
            </div>

            <div className="flex flex-col md:flex-row justify-end gap-3 pt-4 border-t border-slate-200 dark:border-slate-700">
              <motion.button whileTap={{ scale: 0.95 }} type="button" onClick={() => { if(editingPayslip) setEditingPayslip(null); handleTabChange('dashboard'); }} className="w-full md:w-auto px-6 py-3 font-medium text-slate-600 dark:text-slate-300 bg-slate-100 dark:bg-slate-800 border border-transparent dark:border-slate-700 rounded-xl hover:bg-slate-200 dark:hover:bg-slate-700 transition">Скасувати</motion.button>
              <motion.button whileTap={{ scale: 0.95 }} type="submit" className={`w-full md:w-auto px-8 py-3 font-bold text-white rounded-xl transition shadow-md flex items-center justify-center gap-2 ${currentNet < 0 ? 'bg-rose-500 hover:bg-rose-600' : 'bg-blue-600 hover:bg-blue-700'}`}>
                {currentNet < 0 ? <IconAlert /> : <IconCheck />} Зберегти
              </motion.button>
            </div>
          </form>
        </motion.div>
      );
    };

    const validateImportedPayslips = (data) => {
      if (!Array.isArray(data)) {
        return { valid: false, error: "Очікується масив розрахункових листів." };
      }
      if (data.length === 0) {
        return { valid: true };
      }
      const seenPeriods = new Set();
      for (let i = 0; i < data.length; i++) {
        const item = data[i];
        if (!item || typeof item !== 'object') {
          return { valid: false, error: `Елемент #${i + 1} не є коректним об'єктом.` };
        }
        
        const m = Number(item.month);
        const y = Number(item.year);
        if (!Number.isInteger(m) || m < 1 || m > 12) {
          return { valid: false, error: `Елемент #${i + 1}: некоректний місяць (${item.month}). Очікується число від 1 до 12.` };
        }
        if (!Number.isInteger(y) || y < 1900 || y > 2100) {
          return { valid: false, error: `Елемент #${i + 1}: некоректний рік (${item.year}). Очікується 4-значний рік.` };
        }

        const expectedId = `${y}-${String(m).padStart(2, '0')}`;
        if (item.id !== undefined && item.id !== null) {
          if (typeof item.id !== 'string' || item.id.trim() === '') {
            return { valid: false, error: `Елемент #${i + 1}: некоректний id (${item.id}). Очікується текстовий ідентифікатор періоду.` };
          }
          let isLegacyDotMatch = false;
          if (item.id.includes('.')) {
            const parts = item.id.split('.');
            if ((parts[0] == y && parts[1] == m) || (parts[1] == y && parts[0] == m)) {
              isLegacyDotMatch = true;
            }
          }
          if (item.id !== expectedId && !isLegacyDotMatch) {
            return { valid: false, error: `Елемент #${i + 1}: невідповідність id (${item.id}) та періоду (${expectedId}).` };
          }
        }

        if (seenPeriods.has(expectedId)) {
          return { valid: false, error: `Виявлено дублікат періоду ${expectedId} (елемент #${i + 1}).` };
        }
        seenPeriods.add(expectedId);

        if (!Array.isArray(item.accruals) || !Array.isArray(item.deductions)) {
          return { valid: false, error: `Елемент #${i + 1} (${item.id || expectedId}) не містить обов'язкових масивів нарахувань або утримань.` };
        }

        const isValidAmount = (val) => {
          if (val === null || val === undefined || typeof val === 'boolean' || val === '') return false;
          if (typeof val === 'string' && val.trim() === '') return false;
          const num = Number(val);
          return Number.isFinite(num);
        };

        for (const a of item.accruals) {
          if (!a || typeof a !== 'object' || !isValidAmount(a.amount)) {
            return { valid: false, error: `Елемент #${i + 1}: некоректний або нескінченний запис суми у нарахуваннях.` };
          }
        }
        for (const d of item.deductions) {
          if (!d || typeof d !== 'object' || !isValidAmount(d.amount)) {
            return { valid: false, error: `Елемент #${i + 1}: некоректний або нескінченний запис суми в утриманнях.` };
          }
        }
      }
      return { valid: true };
    };

    const Layout = () => {
      const { theme, toggleTheme, isPrivateMode, togglePrivateMode, activeTab, handleTabChange, pendingTab, confirmTabChange, cancelTabChange, dbData, setDbData, generateAndDownloadJSONFile, showToast, hasUnexportedChanges, clearAllData, isMobileMenuOpen, setIsMobileMenuOpen } = useSalaryContext();
      const [isRestoring, setIsRestoring] = useState(false); const [showClearConfirm, setShowClearConfirm] = useState(false); const [isDragging, setIsDragging] = useState(false); const [importConfirmData, setImportConfirmData] = useState(null); const backupInputRef = useRef(null);

      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.key === 'Escape') {
            if (pendingTab) cancelTabChange();
            if (showClearConfirm) setShowClearConfirm(false);
            if (importConfirmData) setImportConfirmData(null);
          }
        };
        document.addEventListener('keydown', handleKeyDown);
        return () => document.removeEventListener('keydown', handleKeyDown);
      }, [pendingTab, cancelTabChange, showClearConfirm, importConfirmData]);

      const processImportedFile = (file) => {
        setIsRestoring(true); const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const importedData = JSON.parse(event.target.result);
            const validation = validateImportedPayslips(importedData);
            if (!validation.valid) {
              showToast(validation.error, "error");
              return;
            }
            const migratedData = importedData.map(item => {
               let id = item.id;
               let month = item.month;
               let year = Number(item.year);
               let monthName = item.monthName;
               let safeM = Number(item.month);
               let safeY = Number(item.year);
               if (id && typeof id === 'string' && id.includes('.')) {
                 const parts = id.split('.');
                 if (parts[0].length === 4) { safeY = Number(parts[0]); safeM = Number(parts[1]); }
                 else if (parts[1].length === 4) { safeY = Number(parts[1]); safeM = Number(parts[0]); }
                 const mIdx = monthName ? MONTH_NAMES.indexOf(monthName) : -1;
                 if ((!safeM || safeM < 1 || safeM > 12) && mIdx !== -1) safeM = mIdx + 1;
                 safeM = Math.max(1, Math.min(12, safeM || 1));
                 safeY = safeY && safeY >= 1900 ? safeY : 2026;
                 id = `${safeY}-${String(safeM).padStart(2, '0')}`;
                 month = safeM;
                 year = safeY;
                 monthName = MONTH_NAMES[safeM - 1];
               }
               return {
                 ...item,
                 id: id || `${year}-${String(month).padStart(2, '0')}`,
                 month: month || (id ? parseInt(id.split('-')[1], 10) : 1),
                 year: year || (id ? parseInt(id.split('-')[0], 10) : 2026),
                 monthName: monthName || MONTH_NAMES[(month ? month - 1 : 0)] || '',
                 accruals: item.accruals.map(a => ({
                   id: a.id || generateId(),
                   name: String(a.name || '').trim(),
                   amount: Number(a.amount),
                   days: a.days !== undefined ? Number(a.days) : 0,
                   hours: a.hours || '0:0',
                   percent: a.percent || ''
                 })),
                 deductions: item.deductions.map(d => ({
                   id: d.id || generateId(),
                   name: String(d.name || '').trim(),
                   amount: Number(d.amount)
                 }))
               };
            });
            if (dbData && dbData.length > 0) {
              setImportConfirmData(migratedData);
            } else {
              setDbData(migratedData);
              showToast(`Дані успішно імпортовано (${migratedData.length} міс.)!`, "success");
              handleTabChange('dashboard');
            }
          } catch (err) {
            showToast("Помилка: файл не є коректним .json", "error");
          } finally {
            setIsRestoring(false);
            if (backupInputRef.current) backupInputRef.current.value = '';
          }
        };
        reader.readAsText(file);
      };

      const handleImportBackup = (e) => { const file = e.target.files[0]; if (!file) return; processImportedFile(file); };
      const handleDragOver = (e) => { e.preventDefault(); setIsDragging(true); };
      const handleDragLeave = (e) => { e.preventDefault(); if (!e.currentTarget.contains(e.relatedTarget)) setIsDragging(false); };
      const handleDrop = (e) => { e.preventDefault(); setIsDragging(false); const file = e.dataTransfer.files?.[0]; if (file && file.name.endsWith('.json')) processImportedFile(file); else if (file) showToast("Будь ласка, завантажте файл .json", "error"); };

      return (
        <div className="h-screen flex flex-col md:flex-row bg-slate-100 dark:bg-slate-900 text-slate-900 dark:text-slate-100 font-sans transition-colors duration-300 relative" onDragOver={handleDragOver} onDragLeave={handleDragLeave} onDrop={handleDrop}>
          <AnimatePresence>
            {isDragging && (
              <motion.div initial={{ opacity: 0 }} animate={{ opacity: 1 }} exit={{ opacity: 0 }} className="absolute inset-0 z-[100] bg-blue-600/90 backdrop-blur-sm flex flex-col items-center justify-center text-white border-8 border-blue-400 border-dashed m-4 rounded-3xl">
                <div className="w-24 h-24 mb-6 animate-bounce text-white flex items-center justify-center [&>svg]:w-full [&>svg]:h-full"><IconDatabase /></div><h2 className="text-3xl md:text-4xl font-bold mb-3 text-center px-4">Відпустіть файл тут</h2><p className="text-base md:text-lg text-blue-100 text-center px-4">щоб імпортувати базу даних</p>
              </motion.div>
            )}
          </AnimatePresence>

          <div className="md:hidden bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 px-4 py-3 flex items-center justify-between z-30">
            <div className="flex items-center space-x-2"><div className="bg-blue-600 p-1.5 rounded-lg text-white"><IconWallet /></div><h1 className="text-lg font-bold">SalaryHub</h1></div>
            <div className="flex items-center gap-2"><button onClick={toggleTheme} className="p-2 text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-lg" aria-label="Змінити тему оформлення">{theme === 'dark' ? <IconSun /> : <IconMoon />}</button><button onClick={togglePrivateMode} className="p-2 text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-lg" aria-label="Перемкнути приватний режим">{isPrivateMode ? <IconEyeOff /> : <IconEye />}</button><button onClick={() => setIsMobileMenuOpen(true)} className="p-2 text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-lg" aria-label="Відкрити меню навігації"><IconMenu /></button></div>
          </div>

          <AnimatePresence>
            {pendingTab && (
              <motion.div initial={{ opacity: 0 }} animate={{ opacity: 1 }} exit={{ opacity: 0 }} role="dialog" aria-modal="true" className="fixed inset-0 z-[60] flex items-center justify-center bg-slate-900/60 backdrop-blur-md p-4"><motion.div initial={{ scale: 0.95, opacity: 0 }} animate={{ scale: 1, opacity: 1 }} exit={{ scale: 0.95, opacity: 0 }} className="bg-white/95 dark:bg-slate-900/80 backdrop-blur-xl rounded-3xl shadow-2xl max-w-md w-full p-6 border border-white/20 dark:border-slate-700/50"><div className="flex items-center gap-3 text-amber-600 dark:text-amber-500 mb-4"><div className="bg-amber-100 dark:bg-amber-900/30 p-2 rounded-full"><IconAlert /></div><h3 className="text-xl font-bold">Незбережені дані</h3></div><p className="text-slate-600 dark:text-slate-300 mb-6">Ви внесли зміни у форму. Якщо ви перейдете на іншу вкладку, незбережені дані будуть втрачені.</p><div className="flex justify-end gap-3 flex-wrap"><button onClick={cancelTabChange} className="px-4 py-2 text-slate-600 dark:text-slate-300 font-medium hover:bg-slate-100 dark:hover:bg-slate-700 rounded-xl transition">Залишитися</button><button onClick={confirmTabChange} className="px-4 py-2 bg-rose-500 text-white font-bold rounded-xl hover:bg-rose-600 transition shadow-sm">Вийти</button></div></motion.div></motion.div>
            )}
            {importConfirmData && (
              <motion.div initial={{ opacity: 0 }} animate={{ opacity: 1 }} exit={{ opacity: 0 }} role="dialog" aria-modal="true" className="fixed inset-0 z-[60] flex items-center justify-center bg-slate-900/60 backdrop-blur-md p-4">
                <motion.div initial={{ scale: 0.95, opacity: 0 }} animate={{ scale: 1, opacity: 1 }} exit={{ scale: 0.95, opacity: 0 }} className="bg-white/95 dark:bg-slate-900/80 backdrop-blur-xl rounded-3xl shadow-2xl max-w-md w-full p-6 border border-white/20 dark:border-slate-700/50">
                  <div className="flex items-center gap-3 text-amber-600 dark:text-amber-500 mb-4">
                    <div className="bg-amber-100 dark:bg-amber-900/30 p-2 rounded-full"><IconAlert /></div>
                    <h3 className="text-xl font-bold">Перезаписати базу даних?</h3>
                  </div>
                  <p className="text-slate-600 dark:text-slate-300 mb-6">
                    У вашій поточній базі вже є <b>{dbData.length}</b> розрахункових листів. Імпорт нового файлу ({importConfirmData.length} листів) замінить поточні дані. Бажаєте продовжити?
                  </p>
                  <div className="flex justify-end gap-3 flex-wrap">
                    <button onClick={() => setImportConfirmData(null)} className="px-4 py-2 text-slate-600 dark:text-slate-300 font-medium hover:bg-slate-100 dark:hover:bg-slate-700 rounded-xl transition">
                      Скасувати
                    </button>
                    <button onClick={() => {
                      setDbData(importConfirmData);
                      showToast(`Дані успішно імпортовано (${importConfirmData.length} міс.)!`, "success");
                      setImportConfirmData(null);
                      handleTabChange('dashboard');
                    }} className="px-4 py-2 bg-blue-600 text-white font-bold rounded-xl hover:bg-blue-700 transition shadow-sm">
                      Замінити дані
                    </button>
                  </div>
                </motion.div>
              </motion.div>
            )}
            {showClearConfirm && (
              <motion.div initial={{ opacity: 0 }} animate={{ opacity: 1 }} exit={{ opacity: 0 }} role="dialog" aria-modal="true" className="fixed inset-0 z-[60] flex items-center justify-center bg-slate-900/60 backdrop-blur-md p-4"><motion.div initial={{ scale: 0.95, opacity: 0 }} animate={{ scale: 1, opacity: 1 }} exit={{ scale: 0.95, opacity: 0 }} className="bg-white/95 dark:bg-slate-900/80 backdrop-blur-xl rounded-3xl shadow-2xl max-w-md w-full p-6 border border-white/20 dark:border-slate-700/50"><div className="flex items-center gap-3 text-rose-600 dark:text-rose-500 mb-4"><div className="bg-rose-100 dark:bg-rose-900/30 p-2 rounded-full"><IconAlert /></div><h3 className="text-xl font-bold">Очистити всі дані?</h3></div><p className="text-slate-600 dark:text-slate-300 mb-6">Ви збираєтесь видалити <b>всі розрахункові листи</b> з бази. Цю дію неможливо скасувати.</p><div className="flex justify-end gap-3 flex-wrap"><button onClick={() => setShowClearConfirm(false)} className="px-4 py-2 text-slate-600 dark:text-slate-300 font-medium hover:bg-slate-100 dark:hover:bg-slate-700 rounded-xl transition">Скасувати</button><button onClick={() => { clearAllData(); setShowClearConfirm(false); }} className="px-4 py-2 bg-rose-600 text-white font-bold rounded-xl hover:bg-rose-700 transition shadow-sm">Очистити</button></div></motion.div></motion.div>
            )}
          </AnimatePresence>

          {isMobileMenuOpen && <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-40 md:hidden" onClick={() => setIsMobileMenuOpen(false)}></div>}

          <aside className={`fixed inset-y-0 left-0 z-50 w-72 bg-white dark:bg-slate-800 border-r border-slate-200 dark:border-slate-700 flex flex-col transform transition-transform duration-300 ease-in-out md:relative md:translate-x-0 ${isMobileMenuOpen ? 'translate-x-0' : '-translate-x-full'}`}>
            <div className="p-5 md:p-6 flex items-center justify-between gap-2 md:mb-6">
              <div className="hidden md:flex items-center gap-2.5 min-w-0">
                <div className="bg-blue-600 p-2 rounded-lg text-white shrink-0"><IconWallet /></div>
                <h1 className="text-xl font-bold text-slate-800 dark:text-slate-100 truncate">SalaryHub</h1>
              </div>
              <div className="md:hidden flex items-center w-full justify-between"><div className="flex items-center space-x-2"><div className="bg-blue-600 p-1.5 rounded-lg text-white"><IconWallet /></div><span className="font-bold text-lg">Меню</span></div><button onClick={() => setIsMobileMenuOpen(false)} className="p-2 bg-slate-100 dark:bg-slate-700 rounded-full" aria-label="Закрити меню навігації"><IconX /></button></div>
              <div className="hidden md:flex items-center gap-1.5 shrink-0">
                <button onClick={toggleTheme} className="p-2 text-slate-400 hover:text-blue-600 dark:hover:text-blue-400 bg-slate-50 dark:bg-slate-700/50 rounded-lg transition-colors" aria-label="Змінити тему оформлення">{theme === 'dark' ? <IconSun /> : <IconMoon />}</button>
                <button onClick={togglePrivateMode} className="p-2 text-slate-400 hover:text-blue-600 dark:hover:text-blue-400 bg-slate-50 dark:bg-slate-700/50 rounded-lg transition-colors" aria-label="Перемкнути приватний режим">{isPrivateMode ? <IconEyeOff /> : <IconEye />}</button>
              </div>
            </div>
            
            <nav className="space-y-2 flex-1 flex flex-col px-4 md:px-6 overflow-y-auto no-scrollbar">
              <div className="space-y-2">
                <motion.button whileTap={{ scale: 0.95 }} onClick={() => handleTabChange('dashboard')} className={`w-full flex items-center space-x-3 px-4 py-3 rounded-xl transition-all text-left ${activeTab === 'dashboard' ? 'bg-blue-50 dark:bg-blue-900/30 text-blue-700 dark:text-blue-400 font-semibold' : 'text-slate-600 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-700/50'}`}>
                  <span className="shrink-0"><IconActivity /></span>
                  <span className="truncate whitespace-normal leading-tight">Головна</span>
                </motion.button>
                <motion.button whileTap={{ scale: 0.95 }} onClick={() => { if (dbData.length > 0) handleTabChange('payslips'); }} disabled={dbData.length === 0} className={`w-full flex items-center space-x-3 px-4 py-3 rounded-xl transition-all text-left ${activeTab === 'payslips' ? 'bg-blue-50 dark:bg-blue-900/30 text-blue-700 dark:text-blue-400 font-semibold' : 'text-slate-600 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-700/50 disabled:opacity-50 disabled:cursor-not-allowed'}`}>
                  <span className="shrink-0"><IconFileText /></span>
                  <span className="truncate whitespace-normal leading-tight">Розрахункові листи</span>
                </motion.button>
                <div className="pt-4 mt-4 border-t border-slate-100 dark:border-slate-700">
                  <motion.button whileTap={{ scale: 0.95 }} onClick={() => handleTabChange('add')} className={`w-full flex items-center justify-center space-x-2 px-4 py-3 rounded-xl font-bold transition-all ${activeTab === 'add' ? 'bg-blue-600 text-white shadow-md' : 'bg-slate-100 dark:bg-slate-900/50 text-slate-700 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700/80'}`}>
                    <span className="shrink-0"><IconPlus /></span>
                    <span className="truncate whitespace-normal leading-tight">Додати дані</span>
                  </motion.button>
                </div>
              </div>
              <div className="mt-auto pt-8 pb-6">
                <div className="text-xs font-semibold text-slate-400 dark:text-slate-500 mb-3 px-2 uppercase tracking-wider">Файли та Дані</div>
                
                <button onClick={() => generateAndDownloadJSONFile(dbData)} disabled={dbData.length === 0} className={`w-full flex items-center justify-between px-4 py-2.5 rounded-lg text-sm font-medium transition-all ${hasUnexportedChanges ? 'bg-amber-100 dark:bg-amber-900/30 text-amber-800 dark:text-amber-400 hover:bg-amber-200 dark:hover:bg-amber-900/50 shadow-sm' : 'text-slate-600 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-700/50 disabled:opacity-50 disabled:cursor-not-allowed'}`}>
                  <div className="flex items-center gap-3"><IconDownload /> Експорт .json</div>
                  {hasUnexportedChanges && <span className="flex h-2.5 w-2.5 relative"><span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-amber-400 opacity-75"></span><span className="relative inline-flex rounded-full h-2.5 w-2.5 bg-amber-500"></span></span>}
                </button>
                
                <label className={`w-full flex items-center gap-3 px-4 py-2.5 rounded-lg text-sm font-medium transition-all cursor-pointer mt-1 ${isRestoring ? 'text-blue-400 bg-blue-50 dark:bg-blue-900/30' : 'text-slate-600 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-700/50'}`}>
                  {isRestoring ? <div className="w-5 h-5 border-2 border-current border-t-transparent rounded-full animate-spin"></div> : <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>} {isRestoring ? 'Імпорт...' : 'Імпорт .json'}
                  <input type="file" accept=".json" className="hidden" onChange={handleImportBackup} ref={backupInputRef} disabled={isRestoring} />
                </label>
                
                <div className="mt-4 pt-3 border-t border-slate-200/60 dark:border-slate-700/60">
                  <div className="text-[10px] font-semibold text-slate-400/80 dark:text-slate-500/80 px-2 uppercase tracking-wider mb-1">Небезпечна зона</div>
                  <button onClick={() => setShowClearConfirm(true)} disabled={dbData.length === 0} className="w-full flex items-center gap-3 px-4 py-2 rounded-lg text-xs font-medium text-slate-400 dark:text-slate-500 hover:text-rose-600 dark:hover:text-rose-400 hover:bg-rose-50/50 dark:hover:bg-rose-950/20 transition-colors disabled:opacity-30 disabled:cursor-not-allowed"><IconTrash /> Очистити базу</button>
                </div>
              </div>
            </nav>
          </aside>

          <main className="flex-1 p-4 md:p-8 overflow-y-auto no-scrollbar relative">
            <AnimatePresence mode="wait">
              {activeTab === 'dashboard' && <DashboardView key="dashboard" />}
              {activeTab === 'payslips' && <PayslipView key="payslips" />}
              {activeTab === 'add' && <AddPayslipView key="add" />}
            </AnimatePresence>
          </main>
        </div>
      );
    };

    class ErrorBoundary extends React.Component {
      constructor(props) { super(props); this.state = { hasError: false, error: null, errorInfo: null }; }
      static getDerivedStateFromError(error) { return { hasError: true, error }; }
      componentDidCatch(error, errorInfo) { 
        console.error("Критична помилка додатку:", error, errorInfo); 
        this.setState({ error, errorInfo });
      }
      handleDownloadBackup = () => {
        try {
          const raw = window.localStorage.getItem('salaryHubData') || '[]';
          const blob = new Blob([raw], { type: 'application/json;charset=utf-8' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `salaryhub_emergency_backup_${new Date().toISOString().slice(0, 10)}.json`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
        } catch (e) {
          alert("Не вдалося створити резервну копію: " + e.message);
        }
      };
      render() {
        if (this.state.hasError) {
          return (
            <div className="min-h-screen flex items-center justify-center bg-slate-100 dark:bg-slate-900 p-4 font-sans">
              <div className="bg-white dark:bg-slate-800 p-8 rounded-2xl shadow-xl max-w-lg w-full border border-rose-200 dark:border-rose-900/50 text-center">
                <div className="w-16 h-16 bg-rose-100 dark:bg-rose-900/30 text-rose-600 dark:text-rose-400 rounded-full flex items-center justify-center mx-auto mb-4">
                  <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
                </div>
                <h2 className="text-2xl font-bold text-slate-800 dark:text-slate-100 mb-2">Ой, щось пішло не так</h2>
                <p className="text-slate-500 dark:text-slate-400 mb-6">Додаток зіткнувся з непередбачуваною помилкою. Ви можете зберегти резервну копію перед очищенням даних.</p>
                <div className="space-y-3">
                  <button onClick={this.handleDownloadBackup} className="w-full py-3 bg-emerald-600 text-white font-bold rounded-xl hover:bg-emerald-700 transition flex items-center justify-center gap-2 shadow-sm">
                    <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" /></svg>
                    Зберегти аварійний бекап (JSON)
                  </button>
                  <button onClick={() => window.location.reload()} className="w-full py-3 bg-blue-600 text-white font-bold rounded-xl hover:bg-blue-700 transition">Оновити сторінку</button>
                  <button onClick={() => { window.localStorage.removeItem('salaryHubData'); window.location.reload(); }} className="w-full py-3 bg-rose-50 text-rose-600 dark:bg-rose-900/20 dark:text-rose-400 font-bold rounded-xl hover:bg-rose-100 dark:hover:bg-rose-900/40 transition">Скинути всі дані та перезавантажити</button>
                </div>
                {this.state.error && (
                  <details className="mt-5 p-3 text-left bg-slate-50 dark:bg-slate-900 rounded-xl text-xs text-rose-500 font-mono overflow-auto max-h-48 border border-rose-200 dark:border-rose-900/50">
                    <summary className="cursor-pointer font-bold mb-1 select-none text-slate-700 dark:text-slate-300">Деталі помилки для розробника</summary>
                    <p className="font-bold whitespace-pre-wrap">{this.state.error.toString()}</p>
                    {this.state.errorInfo && <pre className="whitespace-pre-wrap mt-2 text-[10px] text-slate-500 dark:text-slate-400">{this.state.errorInfo.componentStack}</pre>}
                  </details>
                )}
              </div>
            </div>
          );
        }
        return this.props.children;
      }
    }

    const App = () => { 
      return (
        <ErrorBoundary>
          <SalaryProvider><Layout /></SalaryProvider>
        </ErrorBoundary>
      ); 
    }
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
