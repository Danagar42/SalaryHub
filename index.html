<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SalaryHub - Розрахункові листи (з підтримкою Excel)</title>
  
  <!-- Завантаження Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],

  </script>
  
  <!-- Завантаження React та ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Завантаження Framer Motion, Recharts, Confetti та XLSX (SheetJS) -->
  <script src="https://unpkg.com/framer-motion@11.0.8/dist/framer-motion.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <!-- Бібліотека для парсингу Excel файлів локально -->
  <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700;800&display=swap');
    
    body { font-family: 'Inter', sans-serif; transition: background-color 0.3s, color 0.3s; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    .dark ::-webkit-scrollbar-thumb { background: #475569; }
    .dark ::-webkit-scrollbar-thumb:hover { background: #64748b; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    
    .font-mono { font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
  </style>
</head>
<body class="bg-slate-100 text-slate-900 dark:bg-slate-900 dark:text-slate-100 transition-colors duration-200 overflow-hidden">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useEffect, useRef, createContext, useContext, useCallback } = React;
    const { motion, AnimatePresence, animate } = window.Motion;
    const { LineChart, Line, XAxis, YAxis, CartesianGrid, Tooltip: RechartsTooltip, ResponsiveContainer, PieChart, Pie, Cell, LabelList, Radar, RadarChart, PolarGrid, PolarAngleAxis, PolarRadiusAxis, ReferenceLine } = window.Recharts;

    const IconWallet = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/></svg>;
    const IconCalendar = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg>;
    const IconFileText = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="16" x2="8" y1="13" y2="13"/><line x1="16" x2="8" y1="17" y2="17"/><line x1="10" x2="8" y1="9" y2="9"/></svg>;
    const IconExcel = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><path d="M8 13h2l2 3 2-3h2l-3 4 3 4h-2l-2-3-2 3H8l3-4-3-4z"/></svg>;
    const IconMoneyStack = () => <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 2h16"/><path d="M3 5h18"/><rect x="2" y="8" width="20" height="12" rx="2"/><circle cx="12" cy="14" r="2"/><path d="M6 14h.01"/><path d="M18 14h.01"/></svg>;
    const IconActivity = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>;
    const IconPlus = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>;
    const IconTrash = () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>;
    const IconEdit = () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>;
    const IconDownload = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>;
    const IconDatabase = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg>;
    const IconCheck = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>;
    const IconAlert = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>;
    const IconMoon = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>;
    const IconSun = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>;
    const IconEye = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>;
    const IconEyeOff = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/></svg>;
    const IconMenu = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></svg>;
    const IconX = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" x2="6" y1="6" y2="18"/><line x1="6" x2="18" y1="6" y2="18"/></svg>;
    const IconAreaChart = () => <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg>;
    const IconChevronLeft = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>;
    const IconChevronRight = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>;
    const IconLightbulb = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/></svg>;
    const IconPalmtree = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M13 8c0-2.76-2.46-5-5.5-5S2 5.24 2 8h2l1-1 1 1h4"/><path d="M13 7.14A5.82 5.82 0 0 1 16.5 6c3.04 0 5.5 2.24 5.5 5h-2l-1-1-1 1h-3"/><path d="M5.89 15.55c1.43-.87 3.11-1.4 4.88-1.51M13 10.5a6 6 0 0 1 4.5 2"/><path d="m11.5 13-1.5 8"/><path d="m12.5 13 1.5 8"/></svg>;

    const MONTH_NAMES = ["Січень", "Лютий", "Березень", "Квітень", "Травень", "Червень", "Липень", "Серпень", "Вересень", "Жовтень", "Листопад", "Грудень"];

    let idCounter = 0;
    const generateId = () => {
      if (typeof crypto !== 'undefined' && crypto.randomUUID) {
        return crypto.randomUUID();
      }
      idCounter++;
      return Date.now().toString(36) + Math.random().toString(36).substring(2) + idCounter;
    };

    const formatCurrency = (amount, currencyCode = 'UAH') => {
      const roundedAmount = Math.round(amount || 0);
      try {
        return new Intl.NumberFormat('uk-UA', { 
          style: 'currency', 
          currency: currencyCode,
          minimumFractionDigits: 0,
          maximumFractionDigits: 0
        }).format(roundedAmount);
      } catch (e) {
        return `${roundedAmount} ${currencyCode}`;
      }
    };

    const getTextColorGradient = (value, min, max, theme) => {
      if (max === min) return { color: theme === 'dark' ? '#34d399' : '#047857' }; // темно-зелений для світлої теми
      const percent = (value - min) / (max - min);
      
      if (theme === 'dark') {
        return { color: `hsl(${percent * 120}, 75%, 65%)` };
      } else {
        // Забезпечуємо контрастність WCAG AA (>= 4.5:1) на білому фоні за рахунок компенсації яскравості жовтого спектру
        const yellowDip = Math.sin(percent * Math.PI) * 10;
        const adjustedLightness = 34 - (percent * 8) - yellowDip;
        const hue = percent * 110; // від червоного (0) через оливковий до зеленого (110)
        return { color: `hsl(${hue}, 85%, ${adjustedLightness}%)` };
      }
    };

    const useLocalStorage = (key, initialValue) => {
      const [storedValue, setStoredValue] = useState(() => {
        try {
          const item = window.localStorage.getItem(key);
          if (!item) return initialValue;
          const parsed = JSON.parse(item);
          if (key === 'salaryHubData' && Array.isArray(parsed)) {
            return parsed.filter(item => item && typeof item === 'object').map(item => {
              if (item.id && typeof item.id === 'string' && item.id.includes('.')) {
                const mIdx = item.monthName ? MONTH_NAMES.indexOf(item.monthName) : -1;
                const safeMonth = mIdx !== -1 ? mIdx + 1 : (item.month || 1);
                const monthStr = String(safeMonth).padStart(2, '0');
                const rawYear = item.year != null ? String(item.year) : (item.id.split('.')[1] || '2026');
                const yearNum = rawYear.length === 2 ? `20${rawYear}` : rawYear;
                return { ...item, id: `${yearNum}-${monthStr}`, month: safeMonth, year: Number(yearNum) };
              }
              return item;
            });
          }
          return parsed;
        } catch (error) {
          console.error("Error reading localStorage", error);
          return initialValue;
        }
      });

      const valueRef = (typeof useRef === 'function') ? useRef(storedValue) : { current: storedValue };
      valueRef.current = storedValue;

      const setValue = (value) => {
        try {
          const valueToStore = typeof value === 'function' ? value(valueRef.current) : value;
          const serialized = JSON.stringify(valueToStore);
          window.localStorage.setItem(key, serialized);
          valueRef.current = valueToStore;
          setStoredValue(valueToStore);
          return true;
        } catch (error) {
          console.error("Error setting localStorage", error);
          if (typeof window !== 'undefined' && typeof window.dispatchEvent === 'function') {
            window.dispatchEvent(new CustomEvent('salaryhub-storage-error', { detail: { key, error } }));
          }
          return false;
        }
      };

      return [storedValue, setValue];
    };

    // Єдина функція класифікації утримань (виплати vs податки/збори/інші відрахування)
    const classifyDeduction = (name) => {
      const lower = String(name || '').toLowerCase();

      // Не-виплатні утримання (податки, збори, профвнески, аліменти, виконавчі листи, штрафи, благодійність)
      const isNonPayoutWithholding = 
        /[пp][рp][оo]ф/i.test(lower) ||
        /алімент/i.test(lower) ||
        /виконавч/i.test(lower) ||
        /стягненн/i.test(lower) ||
        /штраф/i.test(lower) ||
        /благодійн|зсу/i.test(lower) ||
        /податок|пдфо|військов|\bвз\b/i.test(lower);

      if (isNonPayoutWithholding) {
        return { isPayout: false, isTax: true, isBank: false, isAdvance: false, isVacation: false, isSick: false, isRegularPayout: false };
      }

      // Виплати працівникові
      const isBank = /перерахування|банк|картк|о\/р/i.test(lower);
      const isAdvance = /аванс/i.test(lower) && !isBank;
      const isVacation = (/(?:випла(?:чен[оі]|т\p{L}*).*відпус[тк]|відпус[тк].*випла)/iu.test(lower)) && !lower.includes('лікарнян');
      const isSick = /(?:випла(?:чен[оі]|т\p{L}*).*лікарнян|лікарнян.*випла)/iu.test(lower);
      const isRegularPayout = /виплат|виплачено/i.test(lower) && !isAdvance && !isVacation && !isSick && !isBank;
      const isPayout = isBank || isAdvance || isVacation || isSick || isRegularPayout;
      const isTax = !isPayout;

      return { isPayout, isTax, isBank, isAdvance, isVacation, isSick, isRegularPayout };
    };

    const getFetchSignal = (timeoutMs = 5000) => {
      if (typeof AbortSignal !== 'undefined' && typeof AbortSignal.timeout === 'function') {
        return AbortSignal.timeout(timeoutMs);
      }
      if (typeof AbortController !== 'undefined') {
        const controller = new AbortController();
        setTimeout(() => controller.abort(), timeoutMs);
        return controller.signal;
      }
      return undefined;
    };

    const useExchangeRates = (dbData) => {
      const [historicalRates, setHistoricalRates] = useLocalStorage(`salaryHubRates_USD_Persist`, {});
      const [liveRateState, setLiveRateState] = useLocalStorage(`salaryHubLiveRate_USD_Persist`, { rate: null, timestamp: null });
      const [isLoadingRate, setIsLoadingRate] = useState(true);
      const [isOfflineRate, setIsOfflineRate] = useState(false);

      useEffect(() => {
        let isMounted = true;
        const fetchLive = async () => {
          setIsLoadingRate(true);
          setIsOfflineRate(false);
          try {
            const signal = getFetchSignal(5000);
            const res = await fetch(`https://bank.gov.ua/NBUStatService/v1/statdirectory/exchange?valcode=USD&json`, { signal });
            if (!res.ok) throw new Error('Network error');
            const data = await res.json();
            if (isMounted && data?.[0]) {
              setLiveRateState({ rate: data[0].rate, timestamp: Date.now() });
            }
          } catch (e) {
            if (isMounted) setIsOfflineRate(true);
          } finally {
            if (isMounted) setIsLoadingRate(false);
          }
        };
        fetchLive();
        return () => { isMounted = false; };
      }, []);

      useEffect(() => {
        if (!dbData || dbData.length === 0) return;
        let isMounted = true;
        
        const fetchHistorical = async () => {
          const missingItems = dbData.filter(item => item && item.id && !historicalRates[item.id]);
          if (missingItems.length === 0) return;

          const fetchItem = async (item) => {
            const dateStr = `${String(item.id).replace('-', '')}01`;
            const signal = getFetchSignal(5000);
            const res = await fetch(`https://bank.gov.ua/NBUStatService/v1/statdirectory/exchange?valcode=USD&date=${dateStr}&json`, { signal });
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const data = await res.json();
            if (data?.[0]?.rate) {
              return { id: item.id, rate: data[0].rate };
            }
            throw new Error('Rate not found');
          };

          const results = await Promise.allSettled(missingItems.map(fetchItem));
          if (!isMounted) return;

          const resolvedRates = {};
          results.forEach(r => {
            if (r.status === 'fulfilled' && r.value?.rate) {
              resolvedRates[r.value.id] = r.value.rate;
            }
          });

          if (Object.keys(resolvedRates).length > 0 && isMounted) {
            setHistoricalRates(prev => ({ ...prev, ...resolvedRates }));
          }
        };
        
        fetchHistorical();
        return () => { isMounted = false; };
      }, [dbData]);

      return { 
        liveRate: liveRateState.rate, 
        rateTimestamp: liveRateState.timestamp,
        historicalRates, 
        isLoadingRate,
        isOfflineRate
      };
    };

    const getMilitaryTaxRate = (year, monthOrIdx, isZeroIndexed = false) => {
      const y = Number(year);
      const m = isZeroIndexed ? Number(monthOrIdx) + 1 : Number(monthOrIdx);
      // Prior to December 2024: 1.5% (0.015). From December 2024 onwards (Law No. 4015-IX): 5.0% (0.05).
      return (y < 2024 || (y === 2024 && m < 12)) ? 0.015 : 0.05;
    };

    const ParserModule = {
      accrualKeywords: [
        'оклад', 'премі', 'відпуст', 'відпуск', 'лікарн', 'непрацездатн', 
        'доплат', 'надбавк', 'надб', 'компенсац', 'індексац', 'оплат', 
        'допомог', 'допом', 'оздор', 'відпус', 'відрядж', 'мобілізован', 'матеріал', 'інші', 'донор', 
        'вислуг', 'стаж', 'нічн', 'святков', 'надуроч'
      ],
      deductionKeywords: [
        'аванс', 'податок', 'пдфо', 'збір', 'внеск', 'виплачено', 'виплачені', 
        'виплата', 'виплат', 'утриман', 'перерахуванн', 'картк', 'банк', 
        'проф', 'алімент', 'борг', 'зсу', 'благодійн', 'виконавч', 'о/р', 'вз', 'страхуван'
      ],

      cleanNumberString: (val) => {
        if (val == null) return '';
        let str = String(val).trim().replace(/(?:грн\.?|uah|₴)/gi, '').trim().replace(/[\s\u00A0]+/g, '');
        str = str.replace(/[\u2212\u2013\u2014]/g, '-');
        if (/^\((.+)\)$/.test(str)) {
          str = '-' + str.slice(1, -1);
        }
        const isNeg = str.startsWith('-');
        const numPart = isNeg ? str.slice(1) : str;
        if (/^\d{1,3}(,\d{3})+(\.\d+)?$/.test(numPart)) {
          str = (isNeg ? '-' : '') + numPart.replace(/,/g, '');
        } else {
          str = str.replace(',', '.');
        }
        return str;
      },

      isDateString: (val) => {
        if (val == null || val === '') return false;
        const raw = String(val).trim();
        // DD.MM.YYYY, DD/MM/YYYY, YYYY-MM-DD
        if (/^\d{1,2}[\.\/]\d{1,2}[\.\/]\d{2,4}$/.test(raw)) return true;
        if (/^\d{4}-\d{2}-\d{2}$/.test(raw)) return true;
        // MM.YYYY or MM/YYYY or MM-YYYY
        if (/^(0?[1-9]|1[0-2])[\.\/\-](19\d{2}|20\d{2})$/.test(raw)) return true;
        // YYYY-MM or YYYY/MM (strictly '-' or '/', not '.' which represents decimal currency cents)
        if (/^(19\d{2}|20\d{2})[\/\-](0?[1-9]|1[0-2])$/.test(raw)) return true;
        return false;
      },

      isPeriodCode: (val) => {
        if (val == null || val === '') return false;
        const raw = String(val).trim();
        if (raw.startsWith('-') || raw.startsWith('\u2212') || raw.startsWith('–') || /^\(.*\)$/.test(raw)) return false;
        // Separated date / period code e.g. 08.2026, 2026-08, 08/2026, 2026/08
        if (/^(0?[1-9]|1[0-2])[\.\/\-](19\d{2}|20\d{2})$/.test(raw)) return true;
        if (/^(19\d{2}|20\d{2})[\/\-](0?[1-9]|1[0-2])$/.test(raw)) return true;
        
        // If it contains decimal cents (.50, .25), it is a monetary amount, not a period code.
        // Strip trailing zero decimals (.0, .00) that may come from Excel numeric cells.
        const cleanWithDot = ParserModule.cleanNumberString(val);
        if (cleanWithDot.startsWith('-')) return false;
        const withoutTrailingZeros = cleanWithDot.replace(/\.0+$/, '');
        if (withoutTrailingZeros.includes('.')) return false;

        // 6-digit period code: strictly YYYYMM where YYYY is 19xx/20xx and MM is 01-12
        const clean = withoutTrailingZeros.replace(/[-.\/]/g, '');
        return /^(19\d{2}|20\d{2})(0[1-9]|1[0-2])$/.test(clean);
      },
      
      isHourValue: (val) => {
        if (val == null || val === '') return false;
        return /^\d+\s*:\s*\d+$/.test(String(val).trim());
      },
      
      isAmount: (val) => {
        if (val == null || val === '') return false;
        if (ParserModule.isDateString(val)) return false;
        const str = ParserModule.cleanNumberString(val);
        if (!/^-?\d+(\.\d+)?$/.test(str)) return false;
        return Math.abs(parseFloat(str)) > 0;
      },

      parseNum: (val) => {
        const str = ParserModule.cleanNumberString(val);
        return parseFloat(str) || 0;
      },
      
      sanitizeName: (val) => String(val ?? '').replace(/^\d+[\.\s-]*/, '').trim(),
      
      findAmountBeforePeriod: (row, startIdx, endIdx, docPeriod = null) => {
        const safeEnd = Math.min(endIdx, row.length);
        for (let i = safeEnd - 1; i >= startIdx; i--) {
          if (ParserModule.isPeriodCode(row[i])) {
            for (let j = i - 1; j >= startIdx; j--) {
              if (ParserModule.isAmount(row[j]) || String(row[j] ?? '').trim() === '0') {
                const amt = ParserModule.parseNum(row[j]);
                // Ensure candidate before period is a real amount or 0 (not item code 1)
                if (amt === 0 || !Number.isInteger(amt) || Math.abs(amt) > 1) {
                  return { amount: amt, index: j };
                }
              }
            }
          }
        }
        return null;
      },
      
      findBestAmount: (row, startIdx, endIdx, docPeriod = null) => {
        const structured = ParserModule.findAmountBeforePeriod(row, startIdx, endIdx, docPeriod);
        if (structured) return structured;
        
        const candidates = [];
        const safeEnd = Math.min(endIdx, row.length);
        for (let i = startIdx; i < safeEnd; i++) {
          if (ParserModule.isAmount(row[i])) {
            const value = ParserModule.parseNum(row[i]);
            candidates.push({ amount: value, index: i, raw: row[i] });
          }
        }
        if (candidates.length === 0) return { amount: 0, index: -1 };
        if (candidates.length === 1) return { amount: candidates[0].amount, index: candidates[0].index };

        let nonDateCandidates = candidates.filter(c => !ParserModule.isDateString(c.raw));
        if (nonDateCandidates.length === 1) return { amount: nonDateCandidates[0].amount, index: nonDateCandidates[0].index };
        if (nonDateCandidates.length === 0) nonDateCandidates = candidates;

        const realAmounts = nonDateCandidates.filter(c => !Number.isInteger(c.amount) || Math.abs(c.amount) > 31);
        if (realAmounts.length === 1) {
          if (!ParserModule.isPeriodCode(realAmounts[0].raw)) {
            return { amount: realAmounts[0].amount, index: realAmounts[0].index };
          }
          // If candidate > 31 is a period code, check for preceding non-period amounts (e.g. 20 грн vs item code 1)
          const preceding = nonDateCandidates.filter(c => c.index < realAmounts[0].index && !ParserModule.isPeriodCode(c.raw) && (!Number.isInteger(c.amount) || Math.abs(c.amount) > 1));
          if (preceding.length > 0) {
            return { amount: preceding[preceding.length - 1].amount, index: preceding[preceding.length - 1].index };
          }
          return { amount: realAmounts[0].amount, index: realAmounts[0].index };
        }
        if (realAmounts.length > 1) {
          const lastCandidate = realAmounts[realAmounts.length - 1];
          if (ParserModule.isPeriodCode(lastCandidate.raw)) {
            return { amount: realAmounts[realAmounts.length - 2].amount, index: realAmounts[realAmounts.length - 2].index };
          }
          return { amount: lastCandidate.amount, index: lastCandidate.index };
        }
        const nonPeriod = nonDateCandidates.filter(c => !ParserModule.isPeriodCode(c.raw) && (!Number.isInteger(c.amount) || Math.abs(c.amount) > 1));
        if (nonPeriod.length > 0) {
          return { amount: nonPeriod[nonPeriod.length - 1].amount, index: nonPeriod[nonPeriod.length - 1].index };
        }
        return { amount: nonDateCandidates[nonDateCandidates.length - 1].amount, index: nonDateCandidates[nonDateCandidates.length - 1].index };
      },
      
      findDeductionAmount: (row, startIdx, endIdx = row.length, docPeriod = null) => {
        const safeEnd = Math.min(endIdx, row.length);
        // Check for deduction amount preceding a period code from right to left
        for (let i = safeEnd - 1; i >= startIdx; i--) {
          if (ParserModule.isPeriodCode(row[i])) {
            for (let j = i - 1; j >= startIdx; j--) {
              if (ParserModule.isAmount(row[j])) {
                const amt = ParserModule.parseNum(row[j]);
                if (!Number.isInteger(amt) || Math.abs(amt) > 1) {
                  return { amount: amt, index: j };
                }
              }
            }
          }
        }
        const candidates = [];
        for (let i = startIdx; i < safeEnd; i++) {
          if (ParserModule.isAmount(row[i])) {
            candidates.push({ amount: ParserModule.parseNum(row[i]), index: i, raw: row[i] });
          }
        }
        if (candidates.length === 0) return { amount: 0, index: -1 };
        if (candidates.length === 1) return { amount: candidates[0].amount, index: candidates[0].index };

        let nonDateCandidates = candidates.filter(c => !ParserModule.isDateString(c.raw));
        if (nonDateCandidates.length === 1) return { amount: nonDateCandidates[0].amount, index: nonDateCandidates[0].index };
        if (nonDateCandidates.length === 0) nonDateCandidates = candidates;

        if (nonDateCandidates.length > 1) {
          const lastCand = nonDateCandidates[nonDateCandidates.length - 1];
          if (ParserModule.isPeriodCode(lastCand.raw)) {
            const prior = nonDateCandidates[nonDateCandidates.length - 2];
            return { amount: prior.amount, index: prior.index };
          }
          return { amount: lastCand.amount, index: lastCand.index };
        }
        return { amount: nonDateCandidates[nonDateCandidates.length - 1].amount, index: nonDateCandidates[nonDateCandidates.length - 1].index };
      },
      
      extractDays: (row, startIdx, amountIdx) => {
        if (amountIdx === -1) return 0;
        for (let i = startIdx; i < amountIdx; i++) {
          if (ParserModule.isAmount(row[i])) {
             const n = ParserModule.parseNum(row[i]);
             if (Number.isInteger(n) && n >= 0 && n <= 31) return n;
          }
        }
        return 0;
      },
      
      extractHours: (row, startIdx, endIdx) => {
        const safeEnd = Math.min(endIdx, row.length);
        for (let i = startIdx; i < safeEnd; i++) {
          if (ParserModule.isHourValue(row[i])) return String(row[i]).trim().replace(/\s+/g, '');
        }
        return '0:0';
      },

      extractControlTotal: (cells, startIdx, endIdx, labelRegex) => {
        for (let k = endIdx - 1; k > startIdx; k--) {
          const val = cells[k];
          if (val != null && val !== '' && !ParserModule.isHourValue(val) && ParserModule.isAmount(val)) {
            return ParserModule.parseNum(val);
          }
        }
        const text = String(cells[startIdx] ?? '').trim();
        const afterLabel = text.replace(labelRegex, '').trim().replace(/^[-:]\s*/, '');
        if (afterLabel) {
          const hourMatch = afterLabel.match(/\d+:\d+\s+(.*)$/);
          const targetStr = hourMatch ? hourMatch[1].trim() : afterLabel;
          if (ParserModule.isAmount(targetStr)) {
            return ParserModule.parseNum(targetStr);
          }
          const m = targetStr.match(/(\d[\d\s\u00A0]*(?:[,.]\d+)?)\s*$/);
          if (m) return ParserModule.parseNum(m[1]);
        }
        return null;
      },

      parseGrid: (rows) => {
        const accruals = [];
        const deductions = [];
        let period = null;
        let totalAccruedControl = null;
        let totalDeductedControl = null;

        const isAccrual = (c) => { 
          const lower = String(c ?? '').toLowerCase();
          if (!lower.trim()) return false;
          if (lower.match(/зсу|благодійн|виплат|виплачено|утриман|податок|пдфо|разом/)) return false; 
          return ParserModule.accrualKeywords.some(kw => lower.includes(kw)); 
        };
        
        const isDeduction = (c) => { 
          const lower = String(c ?? '').toLowerCase();
          if (!lower.trim()) return false;
          if (lower.includes('разом')) return false;
          if (/[пp][рp][оo]ф/i.test(lower)) return true;
          return ParserModule.deductionKeywords.some(kw => lower.includes(kw)); 
        };

        for (const row of rows) {
          if (!Array.isArray(row)) continue;
          for (const cell of row) {
            const text = String(cell ?? '').trim();
            if (!text) continue;
            
            // 1. Пошук формату "за 08.2026" або "08.2026 р."
            const match = text.match(/за\s*(\d{1,2})\.(\d{4})/i) || text.match(/(\d{1,2})\.(\d{4})\s*р/i); 
            if (match) {
              period = { monthIdx: parseInt(match[1], 10) - 1, year: parseInt(match[2], 10) };
              break;
            }
            
            // 2. Пошук формату YYYYMM (напр. 202608) або YYYY-MM
            const yyyymmMatch = text.match(/\b(19\d{2}|20\d{2})[\/\-]?(0[1-9]|1[0-2])\b/);
            if (yyyymmMatch && !period) {
              period = { monthIdx: parseInt(yyyymmMatch[2], 10) - 1, year: parseInt(yyyymmMatch[1], 10) };
            }
            
            // 3. Пошук текстових назв місяців (напр. "Серпень 2026", "за серпень 2026 р.", "березня 2025")
            const monthNames = typeof MONTH_NAMES !== 'undefined' ? MONTH_NAMES : ["Січень", "Лютий", "Березень", "Квітень", "Травень", "Червень", "Липень", "Серпень", "Вересень", "Жовтень", "Листопад", "Грудень"];
            const monthGenitives = ["січня", "лютого", "березня", "квітня", "травня", "червня", "липня", "серпня", "вересня", "жовтня", "листопада", "грудня"];
            monthNames.forEach((mName, mIdx) => {
              const gName = monthGenitives[mIdx];
              const monthRegex = new RegExp(`(?<!\\p{L})(${mName}|${gName})(?!\\p{L})`, 'iu');
              if (monthRegex.test(text)) {
                const yearMatch = text.match(/\b(19\d{2}|20\d{2})\b/);
                if (yearMatch && !period) {
                  period = { monthIdx: mIdx, year: parseInt(yearMatch[1], 10) };
                }
              }
            });
          }
          if (period) break;
        }

        rows.forEach(row => {
          if (!Array.isArray(row)) return;
          const cells = row.map(c => typeof c === 'string' ? c.trim() : c);
          if (!cells.some(c => c != null && c !== '')) return;
          
          const accCtrlIdx = cells.findIndex(c => typeof c === 'string' && /(?:разом|всього|усього)\s*нараховано/i.test(c));
          const dedCtrlIdx = cells.findIndex(c => typeof c === 'string' && /(?:разом|всього|усього)\s*утримано/i.test(c));

          if (accCtrlIdx !== -1) {
            const endLimit = (dedCtrlIdx !== -1 && dedCtrlIdx > accCtrlIdx) ? dedCtrlIdx : cells.length;
            const val = ParserModule.extractControlTotal(cells, accCtrlIdx, endLimit, /(?:разом|всього|усього)\s*нараховано/i);
            if (val !== null) totalAccruedControl = val;
          }
          if (dedCtrlIdx !== -1) {
            const endLimit = (accCtrlIdx !== -1 && accCtrlIdx > dedCtrlIdx) ? accCtrlIdx : cells.length;
            const val = ParserModule.extractControlTotal(cells, dedCtrlIdx, endLimit, /(?:разом|всього|усього)\s*утримано/i);
            if (val !== null) totalDeductedControl = val;
          }

          const accIdx = cells.findIndex(c => typeof c === 'string' && isAccrual(c));
          const dedIdx = cells.findIndex((c, i) => typeof c === 'string' && isDeduction(c) && i !== accIdx);

          if (accIdx !== -1) {
            const endLimit = (dedIdx !== -1 && dedIdx > accIdx) ? dedIdx : cells.length;
            const amountResult = ParserModule.findBestAmount(cells, accIdx + 1, endLimit, period);
            const amount = amountResult.amount;
            const days = ParserModule.extractDays(cells, accIdx + 1, amountResult.index);
            const hours = ParserModule.extractHours(cells, accIdx + 1, endLimit);

            if (amount !== 0 || days > 0) {
              const name = ParserModule.sanitizeName(cells[accIdx]);
              accruals.push({ id: generateId(), name, percent: '', days, hours, amount });
            }
          }

          if (dedIdx !== -1) {
            const endLimitDed = (accIdx !== -1 && accIdx > dedIdx) ? accIdx : cells.length;
            const amountResult = ParserModule.findDeductionAmount(cells, dedIdx + 1, endLimitDed, period);
            const amount = amountResult.amount;

            if (amount !== 0) {
              const name = ParserModule.sanitizeName(cells[dedIdx]);
              deductions.push({ id: generateId(), name, amount });
            }
          }
        });

        // Повертаємо rawRows для fallback-інтерфейсу візуального маппінгу
        return { success: accruals.length > 0 || deductions.length > 0, accruals, deductions, period, rawRows: rows, totalAccruedControl, totalDeductedControl };
      },

      parseTextPayslip: (text) => {
        const lines = text.replace(/(={2,}|-{2,}|\*{2,}|\|)/g, ' ').split('\n');
        const rows = lines.map(line => {
          if (line.includes('\t')) return line.split('\t');
          return line.split(/\s{2,}|;/);
        });
        return ParserModule.parseGrid(rows);
      }
    };

    class WidgetErrorBoundary extends React.Component {

      render() {
        if (this.state.hasError) {
          return (
            <div className="h-64 flex flex-col items-center justify-center text-slate-400 dark:text-slate-500 bg-slate-50 dark:bg-slate-800/50 rounded-xl border border-dashed border-rose-200 dark:border-rose-900/50 p-4 text-center">
              <IconAlert />
              <p className="mt-2 text-sm font-medium">Не вдалося завантажити віджет.</p>
              <button onClick={() => this.setState({ hasError: false })} className="mt-2 text-xs text-blue-500 hover:underline">Спробувати знову</button>
            </div>
          );
        }
        return this.props.children;
      }
    }

      const summaryData = useMemo(() => {

        const baseData = sortedDbData.map((month, index, array) => {

          const validDeductions = month.deductions || [];

          const totalAccrued = validAccruals.reduce((sum, item) => sum + Number(item.amount || 0), 0);
          const totalDeducted = validDeductions.reduce((sum, item) => sum + Number(item.amount || 0), 0);
          
          const totalBonuses = validAccruals
            .filter(a => a.name.toLowerCase().includes('премі') && !a.name.toLowerCase().includes('за рік') && !a.name.toLowerCase().includes('річн'))
            .reduce((sum, item) => sum + Number(item.amount), 0);
            
          const otherBonuses = validAccruals
            .filter(a => {
              const l = a.name.toLowerCase();
              return l.includes('матеріал') || l.includes('допомог') || l.includes('допом') || l.includes('оздор');
            })
            .reduce((sum, item) => sum + Number(item.amount), 0);

          let calculatedBonusPercent = null; let bonusPercentNumeric = 0;

          if (index < array.length - 1) {
            const prevMonth = array[index + 1];
            const currDate = new Date(month.year, month.month - 1); const prevDate = new Date(prevMonth.year, prevMonth.month - 1);
            const diffMonths = (currDate.getFullYear() - prevDate.getFullYear()) * 12 + (currDate.getMonth() - prevDate.getMonth());
            
            if (diffMonths === 1) {
              if (totalBonuses > 0) {
                const prevOkladTotal = prevMonth.accruals.filter(a => a.name.toLowerCase().includes('оклад')).reduce((sum, item) => sum + Number(item.amount), 0);
                if (prevOkladTotal > 0) {
                  let percentVal = ((totalBonuses / prevOkladTotal) * 100); percentVal = Math.round(percentVal / 5) * 5;
                  bonusPercentNumeric = percentVal; calculatedBonusPercent = percentVal + '%';
                }
              }
            }
          }

          // Коректне визначення каналів виплати за допомогою єдиної класифікації
          const advanceSum = validDeductions
            .filter(d => classifyDeduction(d.name).isAdvance)
            .reduce((sum, item) => sum + Number(item.amount), 0);

          const vacationPayoutSum = validDeductions
            .filter(d => classifyDeduction(d.name).isVacation)
            .reduce((sum, item) => sum + Number(item.amount), 0);

          const sickPayoutSum = validDeductions
            .filter(d => classifyDeduction(d.name).isSick)
            .reduce((sum, item) => sum + Number(item.amount), 0);

          // Регулярні виплати виключають банківські перекази та аванси, щоб уникнути подвійного обліку
          const regularPayoutSum = validDeductions
            .filter(d => classifyDeduction(d.name).isRegularPayout)
            .reduce((sum, item) => sum + Number(item.amount), 0);

          const explicitBankSum = validDeductions
            .filter(d => classifyDeduction(d.name).isBank)
            .reduce((sum, item) => sum + Number(item.amount), 0);

          const taxes = validDeductions
            .filter(d => classifyDeduction(d.name).isTax)
            .reduce((sum, item) => sum + Number(item.amount), 0);

          const payoutSum = regularPayoutSum + vacationPayoutSum + sickPayoutSum;

          // Розрахунковий залишок до виплати через банк (без штучного Math.max, коректно відображає сторно/борг)
          const calculatedBankRemainder = totalAccrued - taxes - advanceSum - regularPayoutSum - vacationPayoutSum - sickPayoutSum;
          const toBank = explicitBankSum > 0 ? explicitBankSum : calculatedBankRemainder;

          // Фактично зафіксовані виплати за розрахунковим листком (без припущень про банк, якщо виплати не було)
          const paidBySlipSum = advanceSum + regularPayoutSum + vacationPayoutSum + sickPayoutSum + explicitBankSum;
          const hasExplicitBankPayout = explicitBankSum > 0;

          // Розрахунковий чистий дохід (касовий)
          const rawNetPay = advanceSum + regularPayoutSum + vacationPayoutSum + sickPayoutSum + toBank;
          // Зароблений чистий дохід (нараховано мінус податки, без штучного Math.max)
          const earnedNetPay = totalAccrued - taxes;
          
          let okladAmount = 0; let okladHours = 0; let stazhAmount = 0;
          
          validAccruals.forEach(a => {
            const lowerName = a.name.toLowerCase();
            if (lowerName.includes('оклад')) {
              okladAmount += Number(a.amount);
              if (a.hours) {
                const hoursStr = String(a.hours);
                if (hoursStr.includes(':')) { const parts = hoursStr.split(':'); okladHours += (parseInt(parts[0], 10) || 0) + ((parseInt(parts[1], 10) || 0) / 60); } 
                else { okladHours += parseFloat(hoursStr) || 0; }
              }
            }
            if (/(?:вислуг|стаж)/i.test(lowerName)) stazhAmount += Number(a.amount);
          });
          const hourlyRate = okladHours > 0 ? ((okladAmount + stazhAmount) / okladHours) : 0;
          const hasVacation = validAccruals.some(a => { 
            const n = a.name.toLowerCase(); 
            return (n.includes('відпуст') || n.includes('відпуск')) && !n.includes('донор') && !n.includes('компенсац'); 
          });

          const isFallbackRate = !historicalRates[month.id];
          const actualRate = historicalRates[month.id] || liveRate || 41.5;
          
          const calcPdfo = totalAccrued * 0.18;
          const vzRate = getMilitaryTaxRate(month.year, month.month, false); 
          const calcVz = totalAccrued * vzRate;
          
          let actualPdfo = 0;
          let actualVz = 0;
          
          validDeductions.forEach(d => {
            const lowerName = d.name.toLowerCase();
            if (lowerName.includes('податок') || lowerName.includes('пдфо')) actualPdfo += Number(d.amount);
            if (lowerName.includes('військов') || lowerName.includes('вз')) actualVz += Number(d.amount);
          });
          
          const pdfoDiff = Math.abs(actualPdfo - calcPdfo);
          const vzDiff = Math.abs(actualVz - calcVz);
          const taxWarnings = [];
          
          if (actualPdfo > 0 && pdfoDiff > 5) taxWarnings.push(`ПДФО: очікується ~${formatCurrency(calcPdfo)}, вказано ${formatCurrency(actualPdfo)}`);
          if (actualVz > 0 && vzDiff > 5) taxWarnings.push(`ВЗ: очікується ~${formatCurrency(calcVz)} (${(vzRate*100).toFixed(1)}%), вказано ${formatCurrency(actualVz)}`);

          return { 
            ...month, accruals: validAccruals, deductions: validDeductions,
            totalAccrued, totalDeducted, taxes, rawNetPay, earnedNetPay, toBank, explicitBankSum, paidBySlipSum, hasExplicitBankPayout, calculatedBankRemainder, advanceSum, payoutSum, regularPayoutSum, vacationPayoutSum,             totalBonuses, otherBonuses, hasVacation, calculatedBonusPercent, bonusPercentNumeric, hourlyRate,
            exchangeRate: actualRate,
            isFallbackRate,
            taxWarnings
          };
        });

        const smoothedData = baseData.map((month, index, array) => {
           let smoothedNetPay = month.rawNetPay;

           // Rollover out: if vacation payout was an advance crossing boundary into the next consecutive month (array[index - 1])
           // If current month has vacation accruals, the payout was for this month's vacation, so do not roll over.
           const nextMonth = index > 0 ? array[index - 1] : null;
           const isConsecutiveNext = nextMonth && ((nextMonth.year - month.year) * 12 + (nextMonth.month - month.month) === 1);
           const rolloverOut = (isConsecutiveNext && month.vacationPayoutSum > 0 && !month.hasVacation) ? month.vacationPayoutSum : 0;
           smoothedNetPay -= rolloverOut;

           // Rollover in: if previous consecutive month (array[index + 1]) paid vacation advance crossing into this month
           if (index < array.length - 1) {
              const prevMonth = array[index + 1];
              const isConsecutivePrev = ((month.year - prevMonth.year) * 12 + (month.month - prevMonth.month) === 1);
              if (isConsecutivePrev && prevMonth.vacationPayoutSum > 0 && !prevMonth.hasVacation) {
                 smoothedNetPay += prevMonth.vacationPayoutSum;
              }
           }
           return { ...month, smoothedNetPay };
        });

        return smoothedData.map((month, index, array) => {
           let trendSum = month.smoothedNetPay;
           let count = 1;
           if (index < array.length - 1) { trendSum += array[index+1].smoothedNetPay; count++; }
           if (index < array.length - 2) { trendSum += array[index+2].smoothedNetPay; count++; }
           const trendNetPay = trendSum / count;

           let finalNetPay = month.rawNetPay;
           if (smoothingMode === 'smoothed') finalNetPay = month.smoothedNetPay;
           else if (smoothingMode === 'trend') finalNetPay = trendNetPay;

           const foreignEquivalent = finalNetPay / month.exchangeRate;
           const hourlyRateForeign = month.hourlyRate / month.exchangeRate;

           return {
              ...month,
              netPay: finalNetPay,
              trendNetPay,
              foreignEquivalent,
              hourlyRateForeign
           };
        });
      }, [dbData, historicalRates, liveRate, smoothingMode]);

      const deletePayslip = useCallback((idToDelete) => {
        setDbData(prev => prev.filter(d => d.id !== idToDelete)); showToast("Розрахунковий лист видалено", "success");
      }, [setDbData, showToast]);

      useEffect(() => {
        const handleBeforeUnload = (e) => { if (hasUnexportedChanges) { e.preventDefault(); e.returnValue = 'У вас є неекспортовані зміни!'; } };
        window.addEventListener('beforeunload', handleBeforeUnload);
        return () => window.removeEventListener('beforeunload', handleBeforeUnload);
      }, [hasUnexportedChanges]);

      const generateAndDownloadJSONFile = useCallback(async (dataToExport) => {
        try {
          const jsonData = JSON.stringify(dataToExport, null, 2);
          if (window.showSaveFilePicker) {
            const handle = await window.showSaveFilePicker({ suggestedName: 'salaryData.json', types: [{ description: 'JSON File', accept: { 'application/json': ['.json'] } }] });
            const writable = await handle.createWritable(); await writable.write(jsonData); await writable.close();
            setHasUnexportedChanges(false); showToast("Базу успішно експортовано!", "success");
          } else {
            const blob = new Blob([jsonData], { type: 'application/json;charset=utf-8' }); const url = URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href = url; a.download = `salaryData.json`; document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
            setHasUnexportedChanges(false); showToast("Базу завантажено!", "success");
          }
        } catch (err) {
          if (err.name !== 'AbortError') { showToast("Помилка збереження файлу", "error"); console.error(err); }
        }
      }, [showToast]);

      const contextValue = useMemo(() => ({
        theme, toggleTheme, isPrivateMode, togglePrivateMode,
        smoothingMode, setSmoothingMode,
        activeTab, handleTabChange, pendingTab, confirmTabChange, cancelTabChange,
        selectedMonthId, setSelectedMonthId, isFormDirty, setIsFormDirty, editingPayslip, setEditingPayslip, startEditing, clearAllData, generateDummyData,
        dbData, setDbData, summaryData, liveRate, rateTimestamp, isLoadingRate, isOfflineRate, historicalRates,
        generateAndDownloadJSONFile, deletePayslip, showToast, hasUnexportedChanges,
        isMobileMenuOpen, setIsMobileMenuOpen,
        hasSeenImportHint, setHasSeenImportHint
      }), [theme, isPrivateMode, smoothingMode, activeTab, pendingTab, selectedMonthId, isFormDirty, editingPayslip, dbData, summaryData, liveRate, rateTimestamp, isLoadingRate, isOfflineRate, historicalRates, handleTabChange, confirmTabChange, cancelTabChange, setDbData, generateAndDownloadJSONFile, deletePayslip, showToast, hasUnexportedChanges, startEditing, clearAllData, generateDummyData, isMobileMenuOpen, hasSeenImportHint]);
      
      return (
        <SalaryContext.Provider value={contextValue}>

                  className={`pointer-events-auto flex items-center gap-3 px-5 py-3.5 rounded-2xl shadow-xl font-medium text-sm border ${
                    toast.type === 'error' ? 'bg-rose-50 dark:bg-rose-900/40 text-rose-800 dark:text-rose-300 border-rose-200 dark:border-rose-800' :
                    toast.type === 'warning' ? 'bg-amber-50 dark:bg-amber-900/40 text-amber-800 dark:text-amber-300 border-amber-200 dark:border-amber-800' : 'bg-emerald-50 dark:bg-emerald-900/40 text-emerald-800 dark:text-emerald-300 border-emerald-200 dark:border-emerald-800'
                  }`}
                >
                  <IconAlert /> {toast.message}
                </motion.div>
              ))}
            </AnimatePresence>
          </div>
        </SalaryContext.Provider>
      );
    };

    const DashboardChart = React.memo(({ data, showYearInLabels, theme, mode, isPrivateMode, currencySymbol, onPointClick }) => {

      }, [chartData, showYearInLabels]);

      const handleChartClick = (e) => {

      const CustomChartLabel = (props) => {
        const { x, y, value, index, dataKey } = props;

        const isFirst = index === 0;
        const isLast = index === chartData.length - 1;

        if (index > 0 && index < chartData.length - 1) {

        const diff = maxVal - (minZero ? 0 : minVal); let step;
        if (diff > 0) { const rawStep = diff / targetCount; const mag = Math.pow(10, Math.floor(Math.log10(rawStep))); const res = rawStep / mag; if (res <= 1.5) step = 1 * mag; else if (res <= 3.5) step = 2.5 * mag; else if (res <= 7.5) step = 5 * mag; else step = 10 * mag; } 
        else { step = maxVal === 0 ? 10 : Math.pow(10, Math.floor(Math.log10(maxVal))); if (step > maxVal && maxVal > 0) step = maxVal; }
        let start = minZero ? 0 : Math.floor(minVal / step) * step; if (start < 0) start = 0;

te" />}/></Line><Line yAxisId="right" type="monotone" dataKey="hourlyRateForeign" name={`USD/год (${currencySymbol})`} stroke={tickFill} strokeWidth={1.5} strokeDasharray="6 6" dot={{ r: 2, fill: theme === 'dark' ? '#1e293b' : '#fff', stroke: tickFill }} activeDot={{ r: 4, fill: tickFill, strokeWidth: 0 }} isAnimationActive={true} /></LineChart></ResponsiveContainer>

tLabel {...props} dataKey="netPay" />}/></Line><Line yAxisId="right" type="monotone" dataKey="foreignEquivalent" name={`USD (${currencySymbol})`} stroke={tickFill} strokeWidth={1.5} strokeDasharray="6 6" dot={{ r: 2, fill: theme === 'dark' ? '#1e293b' : '#fff', stroke: tickFill }} activeDot={{ r: 4, fill: tickFill, strokeWidth: 0 }} isAnimationActive={true} /></LineChart></ResponsiveContainer>

        const yearToCompare = selectedYear !== 'all' ? parseInt(selectedYear) : Math.max(...summaryData.map(d => d.year));
        const prevYear = yearToCompare - 1;
        const currYearData = summaryData.filter(d => d.year === yearToCompare);
        const prevYearData = summaryData.filter(d => d.year === prevYear);

        if (currYearData.length > 0 && prevYearData.length > 0) {
          const currAvg = currYearData.reduce((sum, m) => sum + m.netPay, 0) / currYearData.length;
          const prevAvg = prevYearData.reduce((sum, m) => sum + m.netPay, 0) / prevYearData.length;
          const diff = currAvg - prevAvg;
          const percent = prevAvg > 0 ? (diff / prevAvg) * 100 : 0;

          if (diff !== 0) {
            const isPositive = diff > 0;
            yoyAvgNode = (
              <div className="mt-2 flex flex-wrap items-center text-xs font-medium gap-2">
                <span className="text-slate-400">до середнього за {prevYear} рік:</span>
                <span className={`font-mono flex items-center px-2 py-0.5 rounded-md border ${isPositive ? 'bg-emerald-50 text-emerald-600 border-emerald-200 dark:bg-emerald-900/30 dark:text-emerald-400 dark:border-emerald-800' : 'bg-rose-50 text-rose-600 border-rose-200 dark:bg-rose-900/30 dark:text-rose-400 dark:border-rose-800'}`}>
                  {isPositive ? '+' : ''}{percent.toFixed(1)}%
                  <svg className="w-3 h-3 ml-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d={isPositive ? "M5 10l7-7m0 0l7 7m-7-7v18" : "M19 14l-7 7m0 0l-7-7m7 7V3"} />
                  </svg>
                </span>
                <span className="font-mono text-slate-400">({isPositive ? '+' : ''}<PrivacyText text={formatCurrency(diff)} />)</span>
              </div>
            );
          }
        }
      }

      return (
        <motion.div variants={pageVariants} initial="initial" animate="animate" exit="exit" className="space-y-6 max-w-6xl mx-auto pb-10">
          <div className="flex flex-col md:flex-row justify-between items-start md:items-center bg-white dark:bg-slate-800 p-5 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 gap-4 transition-colors">
            <div>
              <h2 className="text-xl font-bold text-slate-800 dark:text-slate-100">Статистика {selectedYear === 'all' ? 'за весь час' : `за ${selectedYear} рік`}</h2>
              <p className="text-sm text-slate-500 dark:text-slate-400 mt-1">Оберіть період для перегляду аналітики</p>
            </div>
            <div className="flex flex-wrap items-center gap-3 w-full md:w-auto justify-start md:justify-end flex-1">
              <div className="flex items-center bg-emerald-50 dark:bg-emerald-900/20 rounded-xl border border-emerald-100 dark:border-emerald-800/50 flex-1 md:flex-none">
                <div className="px-4 py-2 flex items-center gap-2 border-r border-emerald-200 dark:border-emerald-800/50">
                   <span className="font-bold text-emerald-800 dark:text-emerald-300">USD</span>
                </div>
                <div className="px-3 py-2 flex items-center gap-1.5">
                  <span className="text-xs font-medium text-emerald-600/70 dark:text-emerald-400/70">курс:</span>
                  {isLoadingRate ? <Skeleton className="h-4 w-12" /> : <span className="font-mono text-sm font-bold tracking-tight text-emerald-700 dark:text-emerald-400">{liveRate ? `${liveRate.toFixed(2)} ₴` : '—'}</span>}
                  {isOfflineRate && rateTimestamp && (
                    <span title={`Офлайн режим. Останній курс збережено: ${new Date(rateTimestamp).toLocaleString('uk-UA')}`} className="ml-1 flex items-center text-amber-500 bg-amber-50 dark:bg-amber-900/30 p-1 rounded-md cursor-help">
                      <IconAlert />
                    </span>
                  )}
                </div>
              </div>
              
              <CustomSelect compact value={selectedYear} onChange={setSelectedYear} options={[{ value: 'all', label: 'За весь час' }, ...(availableYears || []).filter(Boolean).map(y => ({ value: String(y), label: String(y) }))]} prefix="Період:" wrapperClass="bg-blue-50 dark:bg-blue-900/20 border-blue-100 dark:border-blue-800/50 text-blue-900 dark:text-blue-200" />
            </div>
          </div>

          <div className="bg-white dark:bg-slate-800 p-6 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 flex flex-col md:flex-row md:items-center justify-between transition-colors gap-4">
            <div className="flex items-center space-x-5">
              <div className="p-3.5 bg-gradient-to-br from-emerald-500 to-teal-600 text-white rounded-xl shadow-lg shadow-emerald-500/30 ring-4 ring-emerald-50 dark:ring-emerald-900/20"><IconMoneyStack /></div>
              <div>
                <p className="text-sm text-slate-500 dark:text-slate-400 font-medium mb-1">Середній дохід в міс.</p>
                <div className="flex flex-wrap items-baseline gap-2 md:gap-3">
                  <h3 className="text-3xl font-black font-mono tabular-nums tracking-tight text-blue-600 dark:text-blue-400"><AnimatedNumber value={avgEarnedUAH} currency="UAH" /></h3>
                  <span className="text-lg font-bold font-mono tabular-nums tracking-tight text-emerald-600 dark:text-emerald-400">~ <AnimatedNumber value={avgEarnedForeign} currency={'USD'} /></span>
                </div>
                {yoyAvgNode}
              </div>
            </div>
          </div>

          <div className="bg-white dark:bg-slate-800 p-5 md:p-6 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 transition-colors">
            <div className="flex flex-col md:flex-row justify-between items-start md:items-center mb-4 gap-4">
              <div className="flex items-center gap-4 flex-wrap">
                <h2 className="text-lg font-bold text-slate-800 dark:text-slate-100 flex items-center gap-2"><IconActivity /> Динаміка</h2>
                
                {dashboardData.length > 1 && (
                  <div className="flex bg-slate-100 dark:bg-slate-900/80 p-1 rounded-xl transition-colors border border-slate-200 dark:border-slate-700/50">
                    <button 
                      onClick={() => setSmoothingMode('raw')} 
                      className={`px-3 py-1.5 rounded-lg text-xs md:text-sm transition-all ${smoothingMode === 'raw' ? 'bg-white dark:bg-slate-800 shadow-sm text-slate-900 dark:text-white font-bold' : 'text-slate-500 hover:text-slate-700 dark:text-slate-400 dark:hover:text-slate-200 font-medium'}`}
                      title="Фактичний рух коштів по місяцях виплати"
                    >Фактичний (Касовий)</button>
                    <button 
                      onClick={() => setSmoothingMode('smoothed')} 
                      className={`px-3 py-1.5 rounded-lg text-xs md:text-sm transition-all ${smoothingMode === 'smoothed' ? 'bg-white dark:bg-slate-800 shadow-sm text-slate-900 dark:text-white font-bold' : 'text-slate-500 hover:text-slate-700 dark:text-slate-400 dark:hover:text-slate-200 font-medium'}`}
                      title="Відпускні розподілені за місяцями їх фактичного відпрацювання"
                    >Згладжений (Зароблений)</button>
                    <button 
                      onClick={() => setSmoothingMode('trend')} 
                      className={`px-3 py-1.5 rounded-lg text-xs md:text-sm transition-all ${smoothingMode === 'trend' ? 'bg-white dark:bg-slate-800 shadow-sm text-slate-900 dark:text-white font-bold' : 'text-slate-500 hover:text-slate-700 dark:text-slate-400 dark:hover:text-slate-200 font-medium'}`}
                      title="Ковзне середнє за 3 місяці"
                    >Тренд (Ковзне середнє)</button>
                  </div>
                )}

                {dashboardData.length > 1 && (
                  <div className="flex bg-slate-100 dark:bg-slate-900/80 p-1 rounded-xl transition-colors border border-slate-200 dark:border-slate-700/50">
                    <button onClick={() => setChartMode('income')} className={`px-3 md:px-4 py-1.5 rounded-lg text-sm transition-all flex items-center gap-1.5 ${chartMode === 'income' ? 'bg-white dark:bg-slate-800 shadow-sm text-slate-900 dark:text-white font-bold' : 'text-slate-500 hover:text-slate-700 dark:text-slate-400 dark:hover:text-slate-200 font-medium'}`}>
                      {chartMode === 'income' && <span className="w-1.5 h-1.5 rounded-full bg-emerald-500 shrink-0"></span>}
                      Дохід
                    </button>
                    <button onClick={() => setChartMode('bonus')} className={`px-3 md:px-4 py-1.5 rounded-lg text-sm transition-all flex items-center gap-1.5 ${chartMode === 'bonus' ? 'bg-white dark:bg-slate-800 shadow-sm text-slate-900 dark:text-white font-bold' : 'text-slate-500 hover:text-slate-700 dark:text-slate-400 dark:hover:text-slate-200 font-medium'}`}>
                      {chartMode === 'bonus' && <span className="w-1.5 h-1.5 rounded-full bg-purple-500 shrink-0"></span>}
                      Премії %
                    </button>
                    <button onClick={() => setChartMode('hourly')} className={`px-3 md:px-4 py-1.5 rounded-lg text-sm transition-all flex items-center gap-1.5 ${chartMode === 'hourly' ? 'bg-white dark:bg-slate-800 shadow-sm text-slate-900 dark:text-white font-bold' : 'text-slate-500 hover:text-slate-700 dark:text-slate-400 dark:hover:text-slate-200 font-medium'}`}>
                      {chartMode === 'hourly' && <span className="w-1.5 h-1.5 rounded-full bg-cyan-500 shrink-0"></span>}
                      За год.
                    </button>
                  </div>
                )}
              </div>
              
              {dashboardData.length > 1 && (
                <div className="hidden sm:flex flex-col gap-2 text-xs font-medium text-slate-500 dark:text-slate-400 items-start">
                  {chartMode === 'income' && (
                    <>
                      <div className="flex items-center gap-2"><div className="w-2.5 h-2.5 rounded-full bg-emerald-500"></div>В гривнях (₴)</div>
                      <div className="flex items-center gap-2"><div className="w-2.5 h-2.5 rounded-full bg-slate-400 dark:bg-slate-500"></div>USD ({currencySymbol})</div>
                    </>
                  )}
                  {chartMode === 'bonus' && (
                    <div className="flex items-center gap-2"><div className="w-2.5 h-2.5 rounded-full bg-purple-500"></div>Премія (%)</div>
                  )}
                  {chartMode === 'hourly' && (
                    <>
                      <div className="flex items-center gap-2"><div className="w-2.5 h-2.5 rounded-full bg-cyan-500"></div>Гривні/год (₴)</div>
                      <div className="flex items-center gap-2"><div className="w-2.5 h-2.5 rounded-full bg-slate-400 dark:bg-slate-500"></div>USD/год ({currencySymbol})</div>
                    </>
                  )}
                </div>
              )}
            </div>
            {dashboardData.length > 1 ? (
              <WidgetErrorBoundary>
                <DashboardChart data={dashboardData} showYearInLabels={selectedYear === 'all'} theme={theme} mode={chartMode} isPrivateMode={isPrivateMode} currencySymbol={currencySymbol} onPointClick={handleChartPointClick} /> 
              </WidgetErrorBoundary>
            ) : (
              <div className="h-64 flex flex-col items-center justify-center text-slate-400 dark:text-slate-500 bg-slate-50 dark:bg-slate-800/50 rounded-xl border border-dashed border-slate-200 dark:border-slate-700 mx-2">
                <IconAreaChart /><p className="mt-3 text-sm font-medium">Додайте дані хоча б за два місяці для побудови графіка</p>
              </div>
            )}
          </div>

          {summaryData.length > 2 && seasonalityInsights && (
            <div className="grid grid-cols-1 lg:grid-cols-3 gap-6 transition-colors">
              <div className="lg:col-span-2 bg-white dark:bg-slate-800 p-5 md:p-6 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 flex flex-col justify-between">
                  <h2 className="text-lg font-bold text-slate-800 dark:text-slate-100 flex items-center gap-2 mb-2">
                      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="text-purple-500"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
                      Сезонність доходів
                  </h2>
                  <p className="text-sm text-slate-500 dark:text-slate-400 mb-4">Усереднено фактично отримані кошти по місяцях за весь час</p>
                  <div className="h-[280px] w-full">
                      <ResponsiveContainer width="100%" height="100%">
                          <RadarChart cx="50%" cy="50%" outerRadius="60%" data={seasonalityData}>
                              <PolarGrid stroke={theme === 'dark' ? '#334155' : '#e2e8f0'} />
                              <PolarAngleAxis dataKey="month" tick={<CustomPolarAngleAxis />} />
                              <PolarRadiusAxis angle={30} domain={[0, 'auto']} tick={false} axisLine={false} />
                              <Radar name="Середній дохід" dataKey="average" stroke="#a855f7" strokeWidth={2} fill="#a855f7" fillOpacity={0.3} isAnimationActive={true} />
                              <RechartsTooltip content={<CustomRadarTooltip />} cursor={false} />
                          </RadarChart>
                      </ResponsiveContainer>
                  </div>
              </div>
              
              <div className="lg:col-span-1 bg-gradient-to-br from-purple-50 to-indigo-50 dark:from-purple-900/20 dark:to-indigo-900/20 p-5 md:p-6 rounded-2xl shadow-sm border border-purple-100 dark:border-purple-800/30 flex flex-col justify-center transition-colors">
                   <h3 className="text-sm font-bold text-purple-900 dark:text-purple-300 mb-4 uppercase tracking-wider">Аналіз патернів</h3>
                   
                   <div className="space-y-4">
                       <div className="bg-white/60 dark:bg-slate-800/50 backdrop-blur-sm p-4 rounded-xl border border-white dark:border-slate-700/50 shadow-sm">
                           <div className="flex items-center gap-2 mb-1.5">
                               <span className="text-xl">📈</span>
                               <span className="font-semibold text-slate-700 dark:text-slate-200">Піковий місяць</span>
                           </div>
                           <p className="text-sm text-slate-600 dark:text-slate-400 leading-snug">Історично <strong className="text-slate-800 dark:text-slate-100">{seasonalityInsights.best.fullMonth}</strong> приносить найбільший середній дохід (<span className="font-mono text-purple-600 dark:text-purple-400 font-bold"><PrivacyText text={formatCurrency(seasonalityInsights.best.average)} /></span>).</p>
                       </div>
                       
                       <div className="bg-white/60 dark:bg-slate-800/50 backdrop-blur-sm p-4 rounded-xl border border-white dark:border-slate-700/50 shadow-sm">
                           <div className="flex items-center gap-2 mb-1.5">
                               <span className="text-xl">📉</span>
                               <span className="font-semibold text-slate-700 dark:text-slate-200">Спад активності</span>
                           </div>
                           <p className="text-sm text-slate-600 dark:text-slate-400 leading-snug">Найменш прибутковим у середньому є <strong className="text-slate-800 dark:text-slate-100">{seasonalityInsights.worst.fullMonth}</strong> (<span className="font-mono text-slate-600 dark:text-slate-400 font-bold"><PrivacyText text={formatCurrency(seasonalityInsights.worst.average)} /></span>).</p>
                       </div>
                   </div>
              </div>
            </div>
          )}

          <div className="bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 overflow-hidden transition-colors">
            <div className="p-5 md:p-6 border-b border-slate-100 dark:border-slate-700"><h2 className="text-lg font-bold text-slate-800 dark:text-slate-100">Зведена таблиця</h2></div>
            <div className="overflow-x-auto overflow-y-auto max-h-[600px] no-scrollbar relative">
              <table className="w-full text-left text-sm relative">
                <thead className="bg-slate-50/90 dark:bg-slate-900/90 backdrop-blur-md text-slate-600 dark:text-slate-400 border-b border-slate-200 dark:border-slate-700 sticky top-0 z-30">
                  <tr><th className="px-6 py-4 font-semibold whitespace-nowrap">Місяць</th><th className="px-6 py-4 font-bold text-emerald-600 dark:text-emerald-500 text-right whitespace-nowrap">Зарплата</th><th className="px-6 py-4 font-bold text-blue-600 dark:text-blue-500 text-right whitespace-nowrap">USD ({currencySymbol})</th><th className="px-6 py-4 font-semibold text-center whitespace-nowrap">Премія</th><th className="px-6 py-4 font-semibold text-center whitespace-nowrap">Дія</th></tr>
                </thead>
                <motion.tbody variants={tableContainerVariants} initial="hidden" animate="show">
                  {renderTableRows()}
                </motion.tbody>
              </table>
            </div>
          </div>
        </motion.div>
      );
    };

    const PayslipView = () => {
      const { summaryData, selectedMonthId, setSelectedMonthId, startEditing, handleTabChange } = useSalaryContext();
      const activeMonthData = summaryData.find(m => m.id === selectedMonthId) || summaryData[0];
      const [showMath, setShowMath] = useState(false);

      useEffect(() => {
        const handleKeyDown = (e) => {
          if (!activeMonthData) return;
          const currentIndex = summaryData.findIndex(m => m.id === activeMonthData.id);
          
          if (e.key === 'ArrowLeft' && currentIndex < summaryData.length - 1) {
             setSelectedMonthId(summaryData[currentIndex + 1].id);
          } else if (e.key === 'ArrowRight' && currentIndex > 0) {
             setSelectedMonthId(summaryData[currentIndex - 1].id);
          }
        };
        document.addEventListener('keydown', handleKeyDown);
        return () => document.removeEventListener('keydown', handleKeyDown);
      }, [summaryData, activeMonthData, setSelectedMonthId]);

            const insights = useMemo(() => {
        if (!activeMonthData || summaryData.length < 2) return [];
        
        const results = [];
        const pastData = summaryData.filter(d => d.id !== activeMonthData.id);
        
        const maxNetPay = Math.max(...summaryData.map(d => d.netPay));
        if (activeMonthData.netPay === maxNetPay && maxNetPay > 0) {
          results.push({ id: 'net-record', type: 'positive', icon: '🏆', text: 'Ви отримали рекордну суму фактичних надходжень за весь час!' });
        }
        
        const maxTaxes = Math.max(...summaryData.map(d => d.taxes));
        if (activeMonthData.taxes === maxTaxes && maxTaxes > 0 && pastData.length > 0) {
          results.push({ id: 'tax-record', type: 'neutral', icon: '🏛️', text: <span>Заплачено рекордну суму податків — <PrivacyText text={formatCurrency(maxTaxes)} />.</span> });
        }
        
        const monthsWithBonuses = pastData.filter(d => d.totalBonuses > 0);
        if (activeMonthData.totalBonuses > 0 && monthsWithBonuses.length > 0) {
          const avgBonus = monthsWithBonuses.reduce((sum, d) => sum + d.totalBonuses, 0) / monthsWithBonuses.length;
          const diffPercent = ((activeMonthData.totalBonuses - avgBonus) / avgBonus) * 100;
          
          if (diffPercent > 15) {
            results.push({ id: 'bonus-high', type: 'positive', icon: '🎉', text: `Ваша премія на ${Math.round(diffPercent)}% вища за середню!` });
          } else if (diffPercent < -15) {
            results.push({ id: 'bonus-low', type: 'warning', icon: '📉', text: `Премія цього місяця на ${Math.round(Math.abs(diffPercent))}% нижча за звичайну.` });
          }
        }
        
        const maxHourly = Math.max(...summaryData.map(d => d.hourlyRate));
        if (activeMonthData.hourlyRate === maxHourly && maxHourly > 0 && pastData.length > 0) {
          results.push({ id: 'hourly-record', type: 'positive', icon: '⏱️', text: 'Вартість вашої робочої години досягла історичного максимуму.' });
        }
        
        return results;
      }, [activeMonthData, summaryData]);

      if (!activeMonthData) return <div className="flex justify-center items-center h-64 text-slate-400">Немає даних.</div>;

      const advanceSum = activeMonthData.advanceSum || 0;
      const payoutSum = activeMonthData.payoutSum || 0;
      const taxSum = activeMonthData.taxes || 0;

      const safeDeductions = activeMonthData.deductions || [];
      const safeAccruals = activeMonthData.accruals || [];

      const trueDeductions = safeDeductions.filter(d => d && d.name && classifyDeduction(d.name).isTax);
      const payoutItems = safeDeductions.filter(d => d && d.name && classifyDeduction(d.name).isPayout);

      const trueDeductionsSum = trueDeductions.reduce((sum, item) => sum + Number(item.amount || 0), 0);

      const ACCRUAL_COLORS = { 'Оклад': '#3b82f6', 'Премія': '#a855f7', 'Відпускні': '#f59e0b', 'Інше': '#94a3b8' };
      const DEDUCTION_PALETTE = ['#f43f5e', '#f97316', '#eab308', '#84cc16', '#06b6d4', '#6366f1', '#8b5cf6'];

      const accrualCategories = { 'Оклад': 0, 'Премія': 0, 'Відпускні': 0, 'Інше': 0 };
      safeAccruals.forEach(a => {
          if (!a || !a.name) return;
          const name = String(a.name).toLowerCase();
          if (name.includes('оклад') || name.includes('тариф')) accrualCategories['Оклад'] += Number(a.amount || 0);
          else if (name.includes('премі')) accrualCategories['Премія'] += Number(a.amount || 0);
          else if (name.includes('відпуст')) accrualCategories['Відпускні'] += Number(a.amount || 0);
          else accrualCategories['Інше'] += Number(a.amount || 0);
      });
      const accrualPieData = Object.entries(accrualCategories).filter(([k, v]) => v > 0).map(([name, value]) => ({ name, value, color: ACCRUAL_COLORS[name] }));

      const deductionPieData = [];
      let colorIndex = 0;
      safeDeductions.forEach(d => {
          if (!d || !d.name) return;
          const name = String(d.name).toLowerCase();
          if (classifyDeduction(d.name).isPayout) return;
          
          let displayName = d.name;
          if (name.includes('податок')) displayName = 'ПДФО';
          else if (name.includes('військов') || name.includes('вз')) displayName = 'Військ. збір';
          else if (/[пp][рp][оo]ф/i.test(name) || name.includes('проф')) displayName = 'Профвнески';
          else if (displayName.length > 15) displayName = displayName.substring(0, 15) + '...';
          
          const existing = deductionPieData.find(item => item.name === displayName);
          if (existing) existing.value += Number(d.amount);
          else {
              deductionPieData.push({ name: displayName, value: Number(d.amount), color: DEDUCTION_PALETTE[colorIndex % DEDUCTION_PALETTE.length] });
              colorIndex++;
          }
      });
      deductionPieData.sort((a, b) => b.value - a.value);

      const totalAccrualPie = accrualPieData.reduce((sum, item) => sum + item.value, 0);
      const totalDeductionPie = deductionPieData.reduce((sum, item) => sum + item.value, 0);

      const activeIndex = summaryData.findIndex(m => m.id === activeMonthData.id);
      const prevMonthData = summaryData[activeIndex + 1];
      const nextMonthData = summaryData[activeIndex - 1];
      const lastYearMonthData = summaryData.find(m => m.month === activeMonthData.month && m.year === activeMonthData.year - 1);
      

      let diffNode = null;
      if (prevMonthData) {
        const diff = activeMonthData.netPay - prevMonthData.netPay;
        const percent = prevMonthData.netPay > 0 ? (diff / prevMonthData.netPay) * 100 : 0;
        diffNode = (
          <div className="mt-3 flex items-center justify-center md:justify-end gap-2 text-sm font-medium">
            {diff > 0 && <span className="flex items-center text-emerald-600 bg-emerald-400/10 px-2.5 py-1 rounded-lg border border-emerald-400/20 dark:text-emerald-400 font-mono tracking-tight"><svg className="w-4 h-4 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M5 10l7-7m0 0l7 7m-7-7v18" /></svg><AnimatedNumber value={Math.abs(diff)} currency="UAH" /> <span className="ml-1.5 opacity-80 text-xs">({percent.toFixed(1)}%)</span></span>}
            {diff < 0 && <span className="flex items-center text-rose-600 bg-rose-400/10 px-2.5 py-1 rounded-lg border border-rose-400/20 dark:text-rose-400 font-mono tracking-tight"><svg className="w-4 h-4 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 14l-7 7m0 0l-7-7m7 7V3" /></svg><AnimatedNumber value={Math.abs(diff)} currency="UAH" /><span className="ml-1.5 opacity-80 text-xs">({Math.abs(percent).toFixed(1)}%)</span></span>}
            {diff === 0 && <span className="text-slate-400 bg-slate-400/10 px-2.5 py-1 rounded-lg border border-slate-400/20">Без змін</span>}
            <span className="text-slate-500 text-xs ml-1 hidden sm:inline-block">до мин. міс.</span>
          </div>
        );
      }

      let yoyNode = null;
      if (lastYearMonthData) {
        const yoyDiff = activeMonthData.netPay - lastYearMonthData.netPay;
        const yoyPercent = lastYearMonthData.netPay > 0 ? (yoyDiff / lastYearMonthData.netPay) * 100 : 0;
        yoyNode = (
          <div className="mt-2 text-xs font-medium flex items-center justify-center md:justify-end gap-1.5 opacity-90 font-mono">
