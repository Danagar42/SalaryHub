<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SalaryHub - Розрахункові листи (Оптимізована версія)</title>
  
  <!-- Завантаження Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'], 
          },
          colors: {
            brand: { 50: '#eff6ff', 100: '#dbeafe', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8', 900: '#1e3a8a' },
            profit: { 50: '#ecfdf5', 100: '#d1fae5', 500: '#10b981', 600: '#059669', 700: '#047857' },
            loss: { 50: '#fff1f2', 100: '#ffe4e6', 500: '#f43f5e', 600: '#e11d48', 700: '#be123c' }
          }
        }
      }
    }
  </script>
  
  <!-- Завантаження React та ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Завантаження Framer Motion, Confetti, XLSX та Chart.js (Canvas) -->
  <script src="https://unpkg.com/framer-motion@11.0.8/dist/framer-motion.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700;800&display=swap');
    
    body { font-family: 'Inter', sans-serif; transition: background-color 0.3s, color 0.3s; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    .dark ::-webkit-scrollbar-thumb { background: #475569; }
    .dark ::-webkit-scrollbar-thumb:hover { background: #64748b; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    
    .font-mono { font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-900 dark:text-slate-100 transition-colors duration-200 overflow-hidden">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useEffect, useRef, createContext, useContext, useCallback } = React;
    const { motion, AnimatePresence, animate } = window.Motion;
    const ChartJS = window.Chart; // Отримуємо глобальний об'єкт Chart.js

    // --- Утиліти для фінансової математики (Floating-point fix) ---
    const toCents = (val) => Math.round((Number(val) || 0) * 100);
    const fromCents = (cents) => cents / 100;

    // --- Іконки ---
    const IconWallet = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/></svg>;
    const IconCalendar = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg>;
    const IconFileText = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="16" x2="8" y1="13" y2="13"/><line x1="16" x2="8" y1="17" y2="17"/><line x1="10" x2="8" y1="9" y2="9"/></svg>;
    const IconExcel = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><path d="M8 13h2l2 3 2-3h2l-3 4 3 4h-2l-2-3-2 3H8l3-4-3-4z"/></svg>;
    const IconActivity = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>;
    const IconPlus = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>;
    const IconTrash = () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>;
    const IconEdit = () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>;
    const IconDownload = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>;
    const IconDatabase = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg>;
    const IconCheck = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>;
    const IconAlert = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>;
    const IconMoon = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>;
    const IconSun = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>;
    const IconEye = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>;
    const IconEyeOff = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/></svg>;
    const IconMenu = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></svg>;
    const IconX = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" x2="6" y1="6" y2="18"/><line x1="6" x2="18" y1="6" y2="18"/></svg>;
    const IconAreaChart = () => <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg>;
    const IconChevronLeft = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>;
    const IconChevronRight = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>;

    const MONTH_NAMES = ["Січень", "Лютий", "Березень", "Квітень", "Травень", "Червень", "Липень", "Серпень", "Вересень", "Жовтень", "Листопад", "Грудень"];

    let idCounter = 0;
    const generateId = () => {
      if (typeof crypto !== 'undefined' && crypto.randomUUID) return crypto.randomUUID();
      idCounter++; return Date.now().toString(36) + Math.random().toString(36).substring(2) + idCounter;
    };

    const formatCurrency = (amount, currencyCode = 'UAH') => {
      const roundedAmount = Math.round(amount || 0);
      try {
        return new Intl.NumberFormat('uk-UA', { 
          style: 'currency', currency: currencyCode, minimumFractionDigits: 0, maximumFractionDigits: 0
        }).format(roundedAmount);
      } catch (e) { return `${roundedAmount} ${currencyCode}`; }
    };

    // --- Обгортки для Chart.js ---
    ChartJS.defaults.font.family = "'Inter', sans-serif";
    ChartJS.defaults.color = '#94a3b8';

    const CanvasChart = ({ type, data, options, className }) => {
      const canvasRef = useRef(null);
      const chartRef = useRef(null);

      useEffect(() => {
        if (!canvasRef.current) return;
        if (chartRef.current) chartRef.current.destroy();
        
        chartRef.current = new ChartJS(canvasRef.current, {
          type, data, options: { responsive: true, maintainAspectRatio: false, ...options }
        });
        
        return () => { if (chartRef.current) chartRef.current.destroy(); };
      }, [data, options, type]);

      return <div className={`relative ${className}`}><canvas ref={canvasRef}></canvas></div>;
    };

    // --- Custom Hooks ---
    const useLocalStorage = (key, initialValue) => {
      const [storedValue, setStoredValue] = useState(() => {
        try {
          const item = window.localStorage.getItem(key);
          if (!item) return initialValue;
          const parsed = JSON.parse(item);
          if (key === 'salaryHubData' && Array.isArray(parsed)) {
            return parsed.map(item => {
              if (item.id && item.id.includes('.')) {
                const mIdx = MONTH_NAMES.indexOf(item.monthName);
                const monthStr = String(mIdx + 1).padStart(2, '0');
                const yearNum = item.year.toString().length === 2 ? `20${item.year}` : item.year;
                return { ...item, id: `${yearNum}-${monthStr}`, month: mIdx + 1, year: Number(yearNum) };
              }
              return item;
            });
          }
          return parsed;
        } catch (error) { return initialValue; }
      });

      const setValue = (value) => {
        try {
          const valueToStore = value instanceof Function ? value(storedValue) : value;
          setStoredValue(valueToStore);
          window.localStorage.setItem(key, JSON.stringify(valueToStore));
        } catch (error) { console.error("Error setting localStorage", error); }
      };
      return [storedValue, setValue];
    };

    // ВИПРАВЛЕНО: N+1 та Вихідні дні НБУ
    const useExchangeRates = (dbData) => {
      const [historicalRates, setHistoricalRates] = useLocalStorage(`salaryHubRates_USD_Persist`, {});
      const [liveRateState, setLiveRateState] = useLocalStorage(`salaryHubLiveRate_USD_Persist`, { rate: null, timestamp: null });
      const [isLoadingRate, setIsLoadingRate] = useState(true);
      const [isOfflineRate, setIsOfflineRate] = useState(false);

      useEffect(() => {
        let isMounted = true;
        const fetchLive = async () => {
          setIsLoadingRate(true); setIsOfflineRate(false);
          try {
            const res = await fetch(`https://bank.gov.ua/NBUStatService/v1/statdirectory/exchange?valcode=USD&json`);
            if (!res.ok) throw new Error('Network error');
            const data = await res.json();
            if (isMounted && data?.[0]) setLiveRateState({ rate: data[0].rate, timestamp: Date.now() });
          } catch (e) { if (isMounted) setIsOfflineRate(true); } 
          finally { if (isMounted) setIsLoadingRate(false); }
        };
        fetchLive();
        return () => { isMounted = false; };
      }, []);

      useEffect(() => {
        if (!dbData || dbData.length === 0) return;
        let isMounted = true;
        
        // Функція для пошуку курсу з фолбеком на наступні дні (до 5 днів вперед)
        const fetchRateWithFallback = async (yearStr, monthStr, maxAttempts = 5) => {
            for (let i = 1; i <= maxAttempts; i++) {
                const dayStr = String(i).padStart(2, '0');
                const dateStr = `${yearStr}${monthStr}${dayStr}`;
                try {
                    const res = await fetch(`https://bank.gov.ua/NBUStatService/v1/statdirectory/exchange?valcode=USD&date=${dateStr}&json`);
                    if (res.ok) {
                        const data = await res.json();
                        if (data && data.length > 0) return data[0].rate;
                    }
                } catch (e) { /* ignore and try next day */ }
            }
            return null; // Якщо за 5 днів нічого не знайшли
        };

        const fetchHistorical = async () => {
          // Шукаємо тільки ті дати, яких ще немає в кеші
          const missingDates = dbData.filter(item => !historicalRates[item.id]);
          if (missingDates.length === 0) return;

          // ВИПРАВЛЕНО: Паралельні запити замість послідовних
          const promises = missingDates.map(async (item) => {
             const [yearStr, monthStr] = item.id.split('-');
             const rate = await fetchRateWithFallback(yearStr, monthStr);
             return { id: item.id, rate };
          });

          const results = await Promise.all(promises);
          
          let updated = false;
          const currentRates = { ...historicalRates };
          
          results.forEach(res => {
              if (res.rate) {
                  currentRates[res.id] = res.rate;
                  updated = true;
              }
          });
          
          if (updated && isMounted) setHistoricalRates(currentRates);
        };
        
        fetchHistorical();
        return () => { isMounted = false; };
      }, [dbData]);

      return { liveRate: liveRateState.rate, rateTimestamp: liveRateState.timestamp, historicalRates, isLoadingRate, isOfflineRate };
    };

    const ParserModule = {
      accrualKeywords: ['оклад', 'премі', 'відпустк', 'лікарнян', 'доплат', 'надбавк', 'надб', 'компенсаці', 'індексаці', 'оплат', 'допомог', 'відрядж', 'мобілізован', 'матеріал', 'інші'],
      deductionKeywords: ['аванс', 'податок', 'збір', 'внеск', 'виплачено', 'виплат', 'утриманн', 'перерахуванн', 'картк', 'банк', 'проф', 'алімент', 'борг', 'зсу', 'благодійн', 'виконавч', 'о/р', 'вз'],
      
      isAmount: (val) => {
        if (val == null || val === '') return false;
        const str = String(val).replace(/[\s\u00A0]+/g, '').replace(',', '.');
        if (/^-?\d+(\.\d+)?$/.test(str)) {
          const num = Math.abs(parseFloat(str));
          if (/^(19|20)\d{4}$/.test(str.replace('-', ''))) return false; 
          return num > 0;
        }
        return false;
      },

      parseNum: (val) => {
        const str = String(val).replace(/[\s\u00A0]+/g, '').replace(',', '.');
        return Math.abs(parseFloat(str)) || 0;
      },

      parseGrid: (rows) => {
        const accruals = [];
        const deductions = [];
        let period = null;

        const isAccrual = (c) => { 
          const lower = String(c).toLowerCase(); 
          if (lower.match(/зсу|благодійн|виплат|утриман|дохід|разом/)) return false; 
          return ParserModule.accrualKeywords.some(kw => lower.includes(kw)); 
        };
        const isDeduction = (c) => { 
          const lower = String(c).toLowerCase(); 
          return ParserModule.deductionKeywords.some(kw => lower.includes(kw)) && !lower.includes('разом'); 
        };

        for (const row of rows) {
          for (const cell of row) {
            if (typeof cell === 'string') {
              const match = cell.match(/за\s*(\d{1,2})\.(\d{4})/i) || cell.match(/(\d{1,2})\.(\d{4})\s*р/i); 
              if (match) period = { monthIdx: parseInt(match[1], 10) - 1, year: parseInt(match[2], 10) };
            }
          }
        }

        rows.forEach(row => {
          if (!Array.isArray(row)) return;
          const cleanRow = row.map(c => typeof c === 'string' ? c.trim() : c).filter(c => c != null && c !== '');
          if (cleanRow.length === 0) return;

          let accIdx = cleanRow.findIndex(c => typeof c === 'string' && isAccrual(c));
          let dedIdx = cleanRow.findIndex(c => typeof c === 'string' && isDeduction(c));

          if (accIdx !== -1) {
            let endLimit = (dedIdx !== -1 && dedIdx > accIdx) ? dedIdx : cleanRow.length;
            let slice = cleanRow.slice(accIdx + 1, endLimit);
            
            let amount = 0; let days = 0; let hours = '0:0';
            let hourCell = slice.find(c => typeof c === 'string' && c.includes(':'));
            if (hourCell) hours = String(hourCell).trim();

            let numberCandidates = slice.filter(ParserModule.isAmount).map(ParserModule.parseNum);
            if (numberCandidates.length > 0) {
              amount = Math.max(...numberCandidates); 
              if (numberCandidates.length > 1) {
                let smallest = Math.min(...numberCandidates);
                if (smallest <= 31 && smallest === Math.floor(smallest)) days = smallest; 
              }
            }

            if (amount > 0) {
              let name = String(cleanRow[accIdx]).replace(/^\d+[\.\s]*/, '').trim();
              if (name.toLowerCase().includes('надб') && name.toLowerCase().includes('стаж')) name = 'Надбавка за стаж';
              accruals.push({ id: generateId(), name, percent: '', days, hours, amount });
            }
          }

          if (dedIdx !== -1) {
            let slice = cleanRow.slice(dedIdx + 1);
            let amount = 0;
            let numberCandidates = slice.filter(ParserModule.isAmount).map(ParserModule.parseNum);
            if (numberCandidates.length > 0) amount = Math.max(...numberCandidates);

            if (amount > 0) {
              let name = String(cleanRow[dedIdx]).replace(/^\d+[\.\s]*/, '').trim();
              deductions.push({ id: generateId(), name, amount });
            }
          }
        });

        return { success: accruals.length > 0 || deductions.length > 0, accruals, deductions, period };
      },

      parseTextPayslip: (text) => {
        const lines = text.replace(/(={2,}|-{2,}|\*{2,}|\|)/g, ' ').split('\n');
        const rows = lines.map(line => {
          if (line.includes('\t')) return line.split('\t');
          return line.split(/\s{2,}|;/);
        });
        return ParserModule.parseGrid(rows);
      }
    };

    const pageVariants = { initial: { opacity: 0, y: 15 }, animate: { opacity: 1, y: 0, transition: { duration: 0.3 } }, exit: { opacity: 0, y: -15, transition: { duration: 0.2 } } };
    const tableContainerVariants = { hidden: { opacity: 0 }, show: { opacity: 1, transition: { staggerChildren: 0.05 } }};
    const tableRowVariants = { hidden: { opacity: 0, y: 10 }, show: { opacity: 1, y: 0 }};

    const SalaryContext = createContext(null);
    const useSalaryContext = () => useContext(SalaryContext);

    const SalaryProvider = ({ children }) => {
      const [theme, setTheme] = useLocalStorage('salaryHubTheme', 'light');
      const [isPrivateMode, setIsPrivateMode] = useLocalStorage('salaryHubPrivacy', false);
      const [hasSeenImportHint, setHasSeenImportHint] = useLocalStorage('salaryHub_hasSeenImportHint', false);
      
      const [activeTab, setActiveTab] = useState('dashboard');
      const [selectedMonthId, setSelectedMonthId] = useState(null);
      const [isFormDirty, setIsFormDirty] = useState(false);
      const [pendingTab, setPendingTab] = useState(null);
      const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);
      const [editingPayslip, setEditingPayslip] = useState(null);
      
      const [_dbData, _setDbData] = useLocalStorage('salaryHubData', []);
      const [hasUnexportedChanges, setHasUnexportedChanges] = useState(false);
      
      const dbData = _dbData;
      
      const setDbData = useCallback((newData) => {
        _setDbData(newData); setHasUnexportedChanges(true);
      }, [_setDbData]);

      const { liveRate, rateTimestamp, historicalRates, isLoadingRate, isOfflineRate } = useExchangeRates(dbData);
      const [toasts, setToasts] = useState([]);

      const showToast = useCallback((message, type = 'success') => {
        const id = Date.now() + Math.random();
        setToasts(prev => [...prev, { id, message, type }]);
        setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), 4000);
      }, []);

      useEffect(() => {
        if (theme === 'dark') document.documentElement.classList.add('dark');
        else document.documentElement.classList.remove('dark');
      }, [theme]);

      const toggleTheme = () => setTheme(prev => prev === 'light' ? 'dark' : 'light');
      const togglePrivateMode = () => setIsPrivateMode(prev => !prev);

      const handleTabChange = useCallback((newTab, force = false) => {
        if (!force && isFormDirty && newTab !== activeTab) { setPendingTab(newTab); } 
        else {
          if (newTab !== 'add') setEditingPayslip(null);
          setActiveTab(newTab); setIsMobileMenuOpen(false);
        }
      }, [isFormDirty, activeTab]);

      const confirmTabChange = useCallback(() => {
        setIsFormDirty(false); setEditingPayslip(null); setActiveTab(pendingTab); setPendingTab(null); setIsMobileMenuOpen(false);
      }, [pendingTab]);

      const cancelTabChange = useCallback(() => setPendingTab(null), []);

      const startEditing = useCallback((id) => {
        const slipToEdit = dbData.find(d => d.id === id);
        if (slipToEdit) { setEditingPayslip(slipToEdit); handleTabChange('add', true); }
      }, [dbData, handleTabChange]);

      const clearAllData = useCallback(() => {
        setDbData([]); setHasUnexportedChanges(false); showToast("Всі дані успішно видалено", "success"); handleTabChange('dashboard', true);
      }, [setDbData, showToast, handleTabChange]);

      const generateDummyData = useCallback(() => {
        const dummySlips = [
            { id: '2026-03', month: 3, year: 2026, monthName: 'Березень', accruals: [{id: generateId(), name: 'Посадовий оклад', amount: 32000, days: 21, hours: '168:0'}, {id: generateId(), name: 'Премія', percent: '20%', amount: 6400, days: 0, hours: '0:0'}], deductions: [{id: generateId(), name: 'Плановий аванс', amount: 15000}, {id: generateId(), name: 'Податок з доходів', amount: 6912}, {id: generateId(), name: 'Військовий збір', amount: 576}] },
            { id: '2026-02', month: 2, year: 2026, monthName: 'Лютий', accruals: [{id: generateId(), name: 'Посадовий оклад', amount: 32000, days: 20, hours: '160:0'}, {id: generateId(), name: 'Щорічна відпустка', amount: 8500, days: 5, hours: '0:0'}], deductions: [{id: generateId(), name: 'Плановий аванс', amount: 12000}, {id: generateId(), name: 'Податок з доходів', amount: 7290}, {id: generateId(), name: 'Військовий збір', amount: 607.5}] },
            { id: '2026-01', month: 1, year: 2026, monthName: 'Січень', accruals: [{id: generateId(), name: 'Посадовий оклад', amount: 32000, days: 22, hours: '176:0'}, {id: generateId(), name: 'Премія річна', amount: 15000, days: 0, hours: '0:0'}], deductions: [{id: generateId(), name: 'Плановий аванс', amount: 15000}, {id: generateId(), name: 'Податок з доходів', amount: 8460}, {id: generateId(), name: 'Військовий збір', amount: 705}] },
        ];
        setDbData(dummySlips); showToast("Демо-дані завантажено!", "success"); handleTabChange('dashboard');
      }, [setDbData, showToast, handleTabChange]);

      useEffect(() => {
        const sortedData = [...dbData].sort((a, b) => a.id.localeCompare(b.id));
        if (sortedData.length > 0 && (!selectedMonthId || !sortedData.find(d => d.id === selectedMonthId))) {
          setSelectedMonthId(sortedData[sortedData.length - 1].id);
        }
      }, [dbData, selectedMonthId]);

      // ВИПРАВЛЕНО: Математика в копійках
      const summaryData = useMemo(() => {
        const sortedDbData = [...dbData].sort((a, b) => b.id.localeCompare(a.id)); 
        
        return sortedDbData.map((month, index, array) => {
          const validAccruals = month.accruals.filter(a => !a.name.toLowerCase().match(/виплачен[оі].*відпускн/));
          const validDeductions = month.deductions.filter(d => !d.name.toLowerCase().match(/виплачен[оі].*відпускн/));

          // Конвертуємо в копійки для додавання
          const totalAccruedCents = validAccruals.reduce((sum, item) => sum + toCents(item.amount), 0);
          const totalDeductedCents = validDeductions.reduce((sum, item) => sum + toCents(item.amount), 0);
          
          const totalBonusesCents = validAccruals
            .filter(a => a.name.toLowerCase().includes('премі') && !a.name.toLowerCase().includes('за рік') && !a.name.toLowerCase().includes('річн'))
            .reduce((sum, item) => sum + toCents(item.amount), 0);
            
          let prevMonthVacationPayoutCents = 0; let calculatedBonusPercent = null; let bonusPercentNumeric = 0;

          if (index < array.length - 1) {
            const prevMonth = array[index + 1];
            const currDate = new Date(month.year, month.month - 1); const prevDate = new Date(prevMonth.year, prevMonth.month - 1);
            const diffMonths = (currDate.getFullYear() - prevDate.getFullYear()) * 12 + (currDate.getMonth() - prevDate.getMonth());
            
            if (diffMonths === 1) {
              const vacationInDeductionsCents = prevMonth.deductions.filter(d => d.name.toLowerCase().match(/виплачен[оі].*відпускн/)).reduce((sum, item) => sum + toCents(item.amount), 0);
              const vacationInAccrualsCents = prevMonth.accruals.filter(a => a.name.toLowerCase().match(/виплачен[оі].*відпускн/)).reduce((sum, item) => sum + toCents(item.amount), 0);
              prevMonthVacationPayoutCents = vacationInDeductionsCents + vacationInAccrualsCents;

              if (totalBonusesCents > 0) {
                const prevOkladTotalCents = prevMonth.accruals.filter(a => a.name.toLowerCase().includes('оклад')).reduce((sum, item) => sum + toCents(item.amount), 0);
                if (prevOkladTotalCents > 0) {
                  let percentVal = ((totalBonusesCents / prevOkladTotalCents) * 100); percentVal = Math.round(percentVal / 5) * 5;
                  bonusPercentNumeric = percentVal; calculatedBonusPercent = percentVal + '%';
                }
              }
            }
          }

          const advanceSumCents = validDeductions.filter(d => d.name.toLowerCase().match(/аванс/)).reduce((sum, item) => sum + toCents(item.amount), 0);
          const explicitBankSumCents = validDeductions.filter(d => d.name.toLowerCase().match(/перерахування|банк|картк|о\/р/)).reduce((sum, item) => sum + toCents(item.amount), 0);
          const taxesCents = validDeductions.filter(d => !d.name.toLowerCase().match(/аванс|перерахування|банк|картк|о\/р/)).reduce((sum, item) => sum + toCents(item.amount), 0);
            
          const toBankCents = explicitBankSumCents > 0 ? explicitBankSumCents : (totalAccruedCents - totalDeductedCents);
          const netPayCents = advanceSumCents + toBankCents + prevMonthVacationPayoutCents;
          
          let okladAmountCents = 0; let okladHours = 0; let stazhAmountCents = 0;
          validAccruals.forEach(a => {
            const lowerName = a.name.toLowerCase();
            if (lowerName.includes('оклад')) {
              okladAmountCents += toCents(a.amount);
              if (a.hours) {
                const hoursStr = String(a.hours);
                if (hoursStr.includes(':')) { const parts = hoursStr.split(':'); okladHours += (parseInt(parts[0], 10) || 0) + ((parseInt(parts[1], 10) || 0) / 60); } 
                else { okladHours += parseFloat(hoursStr) || 0; }
              }
            }
            if (lowerName.includes('стаж')) stazhAmountCents += toCents(a.amount);
          });

          // Повертаємо з копійок у гривні
          const totalAccrued = fromCents(totalAccruedCents);
          const totalDeducted = fromCents(totalDeductedCents);
          const netPay = fromCents(netPayCents);
          
          const hourlyRate = okladHours > 0 ? (fromCents(okladAmountCents + stazhAmountCents) / okladHours) : 0;
          const hasVacation = validAccruals.some(a => a.name.toLowerCase().includes('щорічна відпуст'));
          const actualRate = historicalRates[month.id] || 40.0;
          const hourlyRateForeign = hourlyRate / actualRate;
          
          const calcPdfoCents = Math.round(totalAccruedCents * 0.18);
          const vzRate = month.year <= 2024 ? 0.015 : 0.05; 
          const calcVzCents = Math.round(totalAccruedCents * vzRate);
          
          let actualPdfoCents = 0; let actualVzCents = 0;
          validDeductions.forEach(d => {
            const lowerName = d.name.toLowerCase();
            if (lowerName.includes('податок') || lowerName.includes('пдфо')) actualPdfoCents += toCents(d.amount);
            if (lowerName.includes('військов') || lowerName.includes('вз')) actualVzCents += toCents(d.amount);
          });
          
          const taxWarnings = [];
          if (actualPdfoCents > 0 && Math.abs(actualPdfoCents - calcPdfoCents) > 500) taxWarnings.push(`ПДФО: очікується ~${formatCurrency(fromCents(calcPdfoCents))}`);
          if (actualVzCents > 0 && Math.abs(actualVzCents - calcVzCents) > 500) taxWarnings.push(`ВЗ: очікується ~${formatCurrency(fromCents(calcVzCents))}`);

          return { 
            ...month, accruals: validAccruals, deductions: validDeductions,
            totalAccrued, totalDeducted, taxes: fromCents(taxesCents), netPay, toBank: fromCents(toBankCents), advanceSum: fromCents(advanceSumCents), prevMonthVacationPayout: fromCents(prevMonthVacationPayoutCents), 
            totalBonuses: fromCents(totalBonusesCents), hasVacation, calculatedBonusPercent, bonusPercentNumeric, hourlyRate, hourlyRateForeign,
            foreignEquivalent: netPay / actualRate, exchangeRate: actualRate, taxWarnings
          };
        });
      }, [dbData, historicalRates]);

      const deletePayslip = useCallback((idToDelete) => {
        setDbData(prev => prev.filter(d => d.id !== idToDelete)); showToast("Розрахунковий лист видалено", "success");
      }, [setDbData, showToast]);

      const generateAndDownloadJSONFile = useCallback(async (dataToExport) => {
        try {
          const jsonData = JSON.stringify(dataToExport, null, 2);
          const blob = new Blob([jsonData], { type: 'application/json;charset=utf-8' }); const url = URL.createObjectURL(blob);
          const a = document.createElement('a'); a.href = url; a.download = `salaryData.json`; document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
          setHasUnexportedChanges(false); showToast("Базу завантажено!", "success");
        } catch (err) { showToast("Помилка збереження файлу", "error"); }
      }, [showToast]);

      const contextValue = useMemo(() => ({
        theme, toggleTheme, isPrivateMode, togglePrivateMode, activeTab, handleTabChange, pendingTab, confirmTabChange, cancelTabChange,
        selectedMonthId, setSelectedMonthId, isFormDirty, setIsFormDirty, editingPayslip, setEditingPayslip, startEditing, clearAllData, generateDummyData,
        dbData, setDbData, summaryData, liveRate, rateTimestamp, isLoadingRate, isOfflineRate, historicalRates,
        generateAndDownloadJSONFile, deletePayslip, showToast, hasUnexportedChanges, isMobileMenuOpen, setIsMobileMenuOpen, hasSeenImportHint, setHasSeenImportHint
      }), [theme, isPrivateMode, activeTab, pendingTab, selectedMonthId, isFormDirty, editingPayslip, dbData, summaryData, liveRate, rateTimestamp, isLoadingRate, isOfflineRate, historicalRates, handleTabChange, confirmTabChange, cancelTabChange, setDbData, generateAndDownloadJSONFile, deletePayslip, showToast, hasUnexportedChanges, startEditing, clearAllData, generateDummyData, isMobileMenuOpen, hasSeenImportHint]);
      
      return (
        <SalaryContext.Provider value={contextValue}>
          {children}
          <div className="fixed bottom-6 right-6 z-[100] flex flex-col gap-2 pointer-events-none">
            <AnimatePresence>
              {toasts.map((toast) => (
                <motion.div key={toast.id} layout initial={{ opacity: 0, x: 50, scale: 0.9 }} animate={{ opacity: 1, x: 0, scale: 1 }} exit={{ opacity: 0, scale: 0.9, transition: { duration: 0.2 } }}
                  className={`pointer-events-auto flex items-center gap-3 px-5 py-3.5 rounded-2xl shadow-xl font-medium text-sm border ${
                    toast.type === 'error' ? 'bg-rose-50 dark:bg-rose-900/40 text-rose-800 dark:text-rose-300 border-rose-200 dark:border-rose-800' :
                    'bg-slate-800 text-white border-slate-700'
                  }`}
                >
                  {toast.type === 'error' ? <IconAlert /> : <IconCheck />} {toast.message}
                </motion.div>
              ))}
            </AnimatePresence>
          </div>
        </SalaryContext.Provider>
      );
    };

    const AnimatedNumber = ({ value, currency = 'UAH', className = "" }) => {
      const { isPrivateMode } = useSalaryContext();
      return (
        <span className={`font-mono inline-block ${className} ${isPrivateMode ? 'filter blur-[6px] select-none opacity-50' : ''} transition-all duration-300`}>
          {isPrivateMode ? '***' : formatCurrency(value, currency)}
        </span>
      );
    };

    const PrivacyText = ({ text, className = "" }) => {
      const { isPrivateMode } = useSalaryContext();
      return <span className={`${className} ${isPrivateMode ? 'filter blur-[6px] select-none opacity-50 transition-all duration-300' : 'transition-all duration-300'}`}>{isPrivateMode ? '***' : text}</span>;
    };

    const CustomSelect = ({ value, onChange, options, compact = false }) => {
      return (
        <select value={value} onChange={e => onChange(e.target.value)} className={`bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg p-2 text-sm outline-none focus:border-brand-500 ${compact ? 'w-auto' : 'w-full'}`}>
          {options.map(o => <option key={o.value} value={o.value}>{o.label}</option>)}
        </select>
      )
    };

    const ConfirmDeleteButton = ({ onConfirm }) => {
      const [isConfirming, setIsConfirming] = useState(false);
      return (
        <button onClick={() => isConfirming ? onConfirm() : setIsConfirming(true)} onMouseLeave={() => setIsConfirming(false)} className={`font-semibold text-sm transition-colors px-2 py-1.5 rounded-lg flex items-center justify-center min-w-[32px] ${isConfirming ? 'bg-loss-100 text-loss-700 dark:bg-loss-900/50 dark:text-loss-400 w-[70px]' : 'text-slate-400 dark:text-slate-500 hover:text-loss-600 dark:hover:text-loss-400 hover:bg-loss-50 dark:hover:bg-slate-800'}`}>
          {isConfirming ? "Точно?" : <IconTrash />}
        </button>
      );
    };

    const DashboardView = () => {
      const { dbData, summaryData, liveRate, theme, isPrivateMode, handleTabChange, setSelectedMonthId, deletePayslip, startEditing, generateDummyData } = useSalaryContext();
      const [selectedYear, setSelectedYear] = useState('all');
      const [chartMode, setChartMode] = useState('income');
      const currencySymbol = '$';

      const { dashboardData, avgEarnedUAH, avgEarnedForeign, availableYears } = useMemo(() => {
        const aYears = [...new Set(summaryData.map(d => d.year))].sort((a, b) => b - a);
        const dashData = selectedYear === 'all' ? summaryData : summaryData.filter(d => d.year.toString() === selectedYear);
        const avgUAH = dashData.length ? dashData.reduce((sum, m) => sum + m.netPay, 0) / dashData.length : 0;
        const avgForeign = dashData.length ? dashData.reduce((sum, m) => sum + m.foreignEquivalent, 0) / dashData.length : 0;
        return { dashboardData: dashData, avgEarnedUAH: avgUAH, avgEarnedForeign: avgForeign, availableYears: aYears };
      }, [summaryData, selectedYear]);

      const seasonalityData = useMemo(() => {
        if (summaryData.length === 0) return { labels: [], datasets: [] };
        const monthStats = Array.from({ length: 12 }, (_, i) => ({ monthName: MONTH_NAMES[i], shortName: MONTH_NAMES[i].slice(0,3), total: 0, count: 0 }));
        summaryData.forEach(d => { monthStats[d.month - 1].total += d.netPay; monthStats[d.month - 1].count += 1; });
        return {
          labels: monthStats.map(m => m.shortName),
          datasets: [{
            label: 'Середній дохід',
            data: monthStats.map(m => m.count > 0 ? Math.round(m.total / m.count) : 0),
            backgroundColor: theme === 'dark' ? 'rgba(59, 130, 246, 0.2)' : 'rgba(37, 99, 235, 0.1)',
            borderColor: theme === 'dark' ? '#60a5fa' : '#2563eb',
            borderWidth: 2,
            pointBackgroundColor: theme === 'dark' ? '#3b82f6' : '#2563eb',
          }]
        };
      }, [summaryData, theme]);

      const chartConfig = useMemo(() => {
        const reversedData = [...dashboardData].reverse();
        const labels = reversedData.map(d => `${d.monthName.slice(0, 3)} ${selectedYear === 'all' ? String(d.year).slice(2) : ''}`);
        
        let datasets = [];
        if (chartMode === 'income') {
            datasets = [
                { label: 'В гривнях (₴)', data: reversedData.map(d => d.netPay), borderColor: '#10b981', backgroundColor: 'rgba(16, 185, 129, 0.1)', fill: true, tension: 0.3, yAxisID: 'y' },
                { label: `USD (${currencySymbol})`, data: reversedData.map(d => d.foreignEquivalent), borderColor: '#94a3b8', borderDash: [5, 5], tension: 0.3, yAxisID: 'y1' }
            ];
        } else if (chartMode === 'bonus') {
            datasets = [{ label: 'Премія (%)', data: reversedData.map(d => d.bonusPercentNumeric), borderColor: '#2563eb', backgroundColor: 'rgba(37, 99, 235, 0.1)', fill: true, tension: 0.3 }];
        } else {
            datasets = [
                { label: 'Гривні/год (₴)', data: reversedData.map(d => d.hourlyRate), borderColor: '#2563eb', tension: 0.3, yAxisID: 'y' },
                { label: `USD/год (${currencySymbol})`, data: reversedData.map(d => d.hourlyRateForeign), borderColor: '#94a3b8', borderDash: [5, 5], tension: 0.3, yAxisID: 'y1' }
            ];
        }

        return {
            labels, datasets,
            options: {
                interaction: { mode: 'index', intersect: false },
                plugins: { legend: { display: false }, tooltip: { callbacks: { label: function(context) { return isPrivateMode ? '***' : context.dataset.label + ': ' + (chartMode === 'bonus' ? context.parsed.y + '%' : formatCurrency(context.parsed.y, '')); } } } },
                scales: {
                    x: { grid: { display: false, color: theme === 'dark' ? '#334155' : '#e2e8f0' }, ticks: { color: theme === 'dark' ? '#94a3b8' : '#64748b' } },
                    y: { type: 'linear', display: true, position: 'left', grid: { color: theme === 'dark' ? '#334155' : '#e2e8f0' }, ticks: { color: theme === 'dark' ? '#94a3b8' : '#64748b', callback: (val) => isPrivateMode ? '***' : val } },
                    ...(chartMode !== 'bonus' && { y1: { type: 'linear', display: true, position: 'right', grid: { drawOnChartArea: false }, ticks: { color: theme === 'dark' ? '#64748b' : '#94a3b8', callback: (val) => isPrivateMode ? '***' : val } } })
                }
            }
        };
      }, [dashboardData, chartMode, selectedYear, isPrivateMode, theme, currencySymbol]);

      if (dbData.length === 0) {
        return (
          <div className="flex flex-col items-center justify-center py-20 text-center px-4">
            <h2 className="text-2xl font-bold text-slate-800 dark:text-slate-100 mb-2">Немає збережених даних</h2>
            <p className="text-slate-500 max-w-md mb-8">База даних порожня. Додайте свій перший розрахунковий лист.</p>
            <div className="flex gap-3">
              <button onClick={() => handleTabChange('add')} className="px-6 py-3 font-bold text-white bg-brand-600 rounded-xl hover:bg-brand-700 shadow-md">Додати дані</button>
              <button onClick={generateDummyData} className="px-6 py-3 font-bold text-slate-700 bg-white border border-slate-200 dark:bg-slate-800 dark:text-slate-300 dark:border-slate-700 rounded-xl">Демо-дані</button>
            </div>
          </div>
        );
      }

      return (
        <div className="space-y-6 max-w-6xl mx-auto pb-10">
          <div className="flex flex-col md:flex-row justify-between items-start md:items-center bg-white dark:bg-slate-800 p-5 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 gap-4">
            <div>
              <h2 className="text-xl font-bold text-slate-800 dark:text-slate-100">Статистика {selectedYear === 'all' ? 'за весь час' : `за ${selectedYear} рік`}</h2>
            </div>
            <div className="flex items-center gap-3 w-full md:w-auto">
              <div className="px-4 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg text-sm font-mono text-slate-600 dark:text-slate-400">
                1 USD = {liveRate ? `${liveRate.toFixed(2)} ₴` : '—'}
              </div>
              <CustomSelect compact value={selectedYear} onChange={setSelectedYear} options={[{ value: 'all', label: 'За весь час' }, ...availableYears.map(y => ({ value: y.toString(), label: y.toString() }))]} />
            </div>
          </div>

          <div className="bg-white dark:bg-slate-800 p-6 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div className="flex items-center space-x-5">
              <div className="p-3.5 bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-200 rounded-xl"><IconWallet /></div>
              <div>
                <p className="text-sm text-slate-500 font-medium mb-1">Середній дохід в міс.</p>
                <div className="flex items-baseline gap-3">
                  <h3 className="text-3xl font-black text-slate-900 dark:text-white"><AnimatedNumber value={avgEarnedUAH} currency="UAH" /></h3>
                  <span className="text-lg font-bold text-slate-400">~ <AnimatedNumber value={avgEarnedForeign} currency={'USD'} /></span>
                </div>
              </div>
            </div>
          </div>

          <div className="bg-white dark:bg-slate-800 p-5 md:p-6 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700">
            <div className="flex justify-between items-center mb-4">
              <h2 className="text-lg font-bold text-slate-800 dark:text-slate-100 flex items-center gap-2"><IconActivity /> Динаміка</h2>
              {dashboardData.length > 1 && (
                <div className="flex bg-slate-100 dark:bg-slate-900 p-1 rounded-lg border border-slate-200 dark:border-slate-700">
                  <button onClick={() => setChartMode('income')} className={`px-3 py-1.5 rounded-md text-sm font-semibold ${chartMode === 'income' ? 'bg-white dark:bg-slate-800 shadow-sm text-slate-900 dark:text-white' : 'text-slate-500'}`}>Дохід</button>
                  <button onClick={() => setChartMode('bonus')} className={`px-3 py-1.5 rounded-md text-sm font-semibold ${chartMode === 'bonus' ? 'bg-white dark:bg-slate-800 shadow-sm text-slate-900 dark:text-white' : 'text-slate-500'}`}>Премії %</button>
                  <button onClick={() => setChartMode('hourly')} className={`px-3 py-1.5 rounded-md text-sm font-semibold ${chartMode === 'hourly' ? 'bg-white dark:bg-slate-800 shadow-sm text-slate-900 dark:text-white' : 'text-slate-500'}`}>За год.</button>
                </div>
              )}
            </div>
            {dashboardData.length > 1 ? (
              <div className="h-72 w-full">
                <CanvasChart type="line" data={chartConfig.datasets.length ? { labels: chartConfig.labels, datasets: chartConfig.datasets } : {}} options={chartConfig.options} className="w-full h-full" />
              </div>
            ) : (
              <div className="h-64 flex items-center justify-center text-slate-400 bg-slate-50 dark:bg-slate-900/50 rounded-xl border border-dashed border-slate-200 dark:border-slate-700">Додайте більше даних для графіка</div>
            )}
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
             <div className="lg:col-span-2 bg-white dark:bg-slate-800 p-5 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700">
                <h2 className="text-lg font-bold text-slate-800 dark:text-slate-100 mb-4">Сезонність доходів</h2>
                <div className="h-64 w-full">
                    <CanvasChart type="radar" data={seasonalityData} options={{ scales: { r: { angleLines: { color: theme === 'dark' ? '#334155' : '#e2e8f0' }, grid: { color: theme === 'dark' ? '#334155' : '#e2e8f0' }, pointLabels: { color: theme === 'dark' ? '#94a3b8' : '#64748b' }, ticks: { display: false } } }, plugins: { legend: { display: false } } }} className="w-full h-full" />
                </div>
             </div>
          </div>

          <div className="bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 overflow-hidden">
            <div className="p-5 border-b border-slate-100 dark:border-slate-700"><h2 className="text-lg font-bold text-slate-800 dark:text-slate-100">Зведена таблиця</h2></div>
            <div className="overflow-x-auto">
              <table className="w-full text-left text-sm">
                <thead className="bg-slate-50 dark:bg-slate-900/50 text-slate-500 border-b border-slate-200 dark:border-slate-700">
                  <tr><th className="px-6 py-4 font-semibold">Місяць</th><th className="px-6 py-4 font-semibold text-right">Зарплата</th><th className="px-6 py-4 font-semibold text-right">USD</th><th className="px-6 py-4 font-semibold text-center">Дія</th></tr>
                </thead>
                <tbody className="divide-y divide-slate-100 dark:divide-slate-700/50">
                  {dashboardData.map(row => (
                    <tr key={row.id} className="hover:bg-slate-50 dark:hover:bg-slate-700/30">
                      <td className="px-6 py-4 font-medium">{row.monthName} <span className="text-slate-400">{row.year}</span></td>
                      <td className="px-6 py-4 text-right font-bold font-mono text-slate-900 dark:text-white"><PrivacyText text={formatCurrency(row.netPay)} /></td>
                      <td className="px-6 py-4 text-right font-mono text-slate-500"><PrivacyText text={formatCurrency(row.foreignEquivalent, 'USD')} /></td>
                      <td className="px-6 py-4 text-center">
                        <div className="flex items-center justify-center gap-2">
                          <button onClick={() => { setSelectedMonthId(row.id); handleTabChange('payslips'); }} className="text-brand-600 hover:text-brand-800 font-semibold text-sm px-3 py-1.5 bg-brand-50 hover:bg-brand-100 dark:bg-brand-900/20 dark:hover:bg-brand-900/40 rounded-lg">Деталі</button>
                          <button onClick={() => startEditing(row.id)} className="text-slate-400 hover:text-brand-600 p-1.5"><IconEdit /></button>
                          <ConfirmDeleteButton onConfirm={() => deletePayslip(row.id)} />
                        </div>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    };

    const PayslipView = () => {
      const { summaryData, selectedMonthId, setSelectedMonthId, startEditing, theme } = useSalaryContext();
      const activeMonthData = summaryData.find(m => m.id === selectedMonthId) || summaryData[0];
      const [showMath, setShowMath] = useState(false);

      if (!activeMonthData) return <div className="p-10 text-center">Немає даних.</div>;

      const trueDeductions = activeMonthData.deductions.filter(d => !d.name.toLowerCase().match(/аванс|виплат|перерахування|банк|картк|о\/р/));
      const trueDeductionsSum = trueDeductions.reduce((sum, item) => sum + item.amount, 0);

      // Використовуємо кольори Tailind для семантики
      const paletteAccruals = ['#10b981', '#34d399', '#6ee7b7', '#a7f3d0']; // Emerald shades
      const paletteDeductions = ['#f43f5e', '#fb7185', '#fda4af', '#fecdd3']; // Rose shades

      const accrualCategories = { 'Оклад': 0, 'Премія': 0, 'Відпускні': 0, 'Інше': 0 };
      activeMonthData.accruals.forEach(a => {
          const name = a.name.toLowerCase();
          if (name.includes('оклад') || name.includes('тариф')) accrualCategories['Оклад'] += a.amount;
          else if (name.includes('премі')) accrualCategories['Премія'] += a.amount;
          else if (name.includes('відпуст')) accrualCategories['Відпускні'] += a.amount;
          else accrualCategories['Інше'] += a.amount;
      });
      const accrualPieData = {
          labels: Object.keys(accrualCategories).filter(k => accrualCategories[k] > 0),
          datasets: [{ data: Object.values(accrualCategories).filter(v => v > 0), backgroundColor: paletteAccruals, borderWidth: 0 }]
      };

      const dCats = {};
      trueDeductions.forEach(d => { dCats[d.name] = (dCats[d.name] || 0) + d.amount; });
      const deductionPieData = {
          labels: Object.keys(dCats),
          datasets: [{ data: Object.values(dCats), backgroundColor: paletteDeductions, borderWidth: 0 }]
      };

      const pieOptions = { cutout: '75%', plugins: { legend: { position: 'bottom', labels: { color: theme === 'dark' ? '#94a3b8' : '#64748b', boxWidth: 12 } }, tooltip: { callbacks: { label: (ctx) => ` ${formatCurrency(ctx.raw)}` } } } };

      return (
        <div className="space-y-6 max-w-5xl mx-auto pb-12">
          <div className="bg-white dark:bg-slate-800 p-5 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 flex justify-between items-center">
            <h1 className="text-xl font-bold text-slate-800 dark:text-slate-100 flex items-center gap-3">
              Лист за {activeMonthData.monthName} {activeMonthData.year}
              <button onClick={() => startEditing(activeMonthData.id)} className="text-sm bg-slate-100 dark:bg-slate-700 px-3 py-1.5 rounded-lg flex items-center gap-1.5 font-normal"><IconEdit /> Редагувати</button>
            </h1>
            <CustomSelect compact value={selectedMonthId} onChange={setSelectedMonthId} options={summaryData.map(m => ({ value: m.id, label: `${m.monthName} ${m.year}` }))} />
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <div className="bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 overflow-hidden">
              <div className="bg-profit-50 dark:bg-profit-900/10 px-5 py-4 border-b border-profit-100 dark:border-profit-900/20 flex justify-between items-center">
                <h3 className="text-lg font-bold text-profit-700 dark:text-profit-400">Нараховано</h3>
                <span className="font-bold font-mono text-profit-700 dark:text-profit-400"><AnimatedNumber value={activeMonthData.totalAccrued} /></span>
              </div>
              <table className="w-full text-sm text-left">
                <tbody className="divide-y divide-slate-50 dark:divide-slate-700/50">
                  {activeMonthData.accruals.map((item, idx) => (
                    <tr key={idx}>
                      <td className="px-5 py-3 font-medium">{item.name}</td>
                      <td className="px-5 py-3 text-right font-mono text-slate-600 dark:text-slate-400">{item.days ? `${item.days}д` : ''}</td>
                      <td className="px-5 py-3 text-right font-bold font-mono"><PrivacyText text={formatCurrency(item.amount)} /></td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>

            <div className="bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 overflow-hidden">
              <div className="bg-loss-50 dark:bg-loss-900/10 px-5 py-4 border-b border-loss-100 dark:border-loss-900/20 flex justify-between items-center">
                <h3 className="text-lg font-bold text-loss-700 dark:text-loss-400">Утримано</h3>
                <span className="font-bold font-mono text-loss-700 dark:text-loss-400"><AnimatedNumber value={trueDeductionsSum} /></span>
              </div>
              <table className="w-full text-sm text-left">
                <tbody className="divide-y divide-slate-50 dark:divide-slate-700/50">
                  {trueDeductions.map((item, idx) => (
                    <tr key={`tax-${idx}`}>
                      <td className="px-5 py-3 font-medium">{item.name}</td>
                      <td className="px-5 py-3 text-right font-bold font-mono"><PrivacyText text={formatCurrency(item.amount)} /></td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
             <div className="bg-white dark:bg-slate-800 p-5 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700">
                 <h3 className="text-center font-bold text-slate-700 dark:text-slate-300 mb-4">Структура Нарахувань</h3>
                 <div className="h-48 w-full"><CanvasChart type="doughnut" data={accrualPieData} options={pieOptions} className="w-full h-full" /></div>
             </div>
             <div className="bg-white dark:bg-slate-800 p-5 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700">
                 <h3 className="text-center font-bold text-slate-700 dark:text-slate-300 mb-4">Структура Утримань</h3>
                 <div className="h-48 w-full"><CanvasChart type="doughnut" data={deductionPieData} options={pieOptions} className="w-full h-full" /></div>
             </div>
          </div>

          <div className="bg-slate-900 text-white rounded-2xl shadow-xl flex flex-col relative overflow-hidden border border-slate-800">
            <div className="p-6 md:p-8 flex justify-between items-center relative z-10">
              <div>
                <h2 className="text-2xl font-bold">Чистий дохід</h2>
                <button onClick={() => setShowMath(!showMath)} className="mt-2 text-sm text-slate-400 hover:text-white underline">Деталі розрахунку</button>
              </div>
              <div className="text-4xl font-black text-brand-400 font-mono tracking-tight"><AnimatedNumber value={activeMonthData.netPay} /></div>
            </div>
            {showMath && (
              <div className="bg-slate-800/50 p-6 border-t border-slate-700 text-sm font-mono space-y-3">
                 <div className="flex justify-between"><span className="text-slate-400">Нараховано</span><span className="text-profit-400">+{formatCurrency(activeMonthData.totalAccrued)}</span></div>
                 <div className="flex justify-between"><span className="text-slate-400">Податки/Збори</span><span className="text-loss-400">-{formatCurrency(activeMonthData.taxes)}</span></div>
                 <div className="flex justify-between"><span className="text-slate-400">Аванси (вже виплачено)</span><span className="text-white">{formatCurrency(activeMonthData.advanceSum)}</span></div>
                 <div className="flex justify-between border-t border-slate-700 pt-3 font-bold"><span className="text-white">На карту (залишок)</span><span className="text-white">{formatCurrency(activeMonthData.toBank)}</span></div>
              </div>
            )}
          </div>
        </div>
      );
    };

    const AddPayslipView = () => {
      const { dbData, setDbData, setSelectedMonthId, handleTabChange, showToast, setIsFormDirty, editingPayslip, setEditingPayslip } = useSalaryContext();
      
      const [monthIdx, setMonthIdx] = useState(0); const [year, setYear] = useState(''); const [pastedText, setPastedText] = useState('');
      const [accruals, setAccruals] = useState([]); const [deductions, setDeductions] = useState([]);
      
      useEffect(() => {
        if (editingPayslip) {
          setMonthIdx(editingPayslip.month - 1); setYear(editingPayslip.year.toString());
          setAccruals(editingPayslip.accruals.length ? editingPayslip.accruals.map(a => ({...a, id: generateId()})) : []);
          setDeductions(editingPayslip.deductions.length ? editingPayslip.deductions.map(d => ({...d, id: generateId()})) : []);
        } else {
          const today = new Date(); setMonthIdx(today.getMonth()); setYear(today.getFullYear().toString());
          setAccruals([{ id: generateId(), name: 'Посадовий оклад', percent: '', days: 21, hours: '168:0', amount: '' }]);
          setDeductions([{ id: generateId(), name: 'Плановий аванс', amount: '' }, { id: generateId(), name: 'Податок з доход. фіз.ос.', amount: '' }, { id: generateId(), name: 'Військовий збір', amount: '' }]);
        }
      }, [editingPayslip]);

      // ВИПРАВЛЕНО: Математика стейту форми в копійках
      const currentAccruedCents = accruals.reduce((sum, item) => sum + toCents(item.amount), 0);
      const currentDeductedCents = deductions.reduce((sum, item) => sum + toCents(item.amount), 0);
      const currentNetCents = currentAccruedCents - currentDeductedCents;

      const markDirty = () => setIsFormDirty(true);
      const handleAddAccrual = () => { setAccruals([...accruals, { id: generateId(), name: '', percent: '', days: 0, hours: '0:0', amount: '' }]); markDirty(); };
      const handleAddDeduction = () => { setDeductions([...deductions, { id: generateId(), name: '', amount: '' }]); markDirty(); };
      const removeAccrual = (id) => { setAccruals(accruals.filter(a => a.id !== id)); markDirty(); };
      const removeDeduction = (id) => { setDeductions(deductions.filter(d => d.id !== id)); markDirty(); };

      const cleanDataList = (list) => list.filter(item => item.name.trim() !== '' && item.amount !== '' && !isNaN(Number(item.amount))).map(item => ({ ...item, amount: Number(item.amount) }));

      const handleFormSubmit = (e) => {
        e.preventDefault();
        if (currentNetCents < 0) { showToast("Чистий дохід не може бути від'ємним.", "error"); return; }

        const monthId = `${year}-${String(monthIdx + 1).padStart(2, '0')}`; 
        const cleanedAccruals = cleanDataList(accruals); const cleanedDeductions = cleanDataList(deductions);
        if(cleanedAccruals.length === 0 && cleanedDeductions.length === 0) { showToast("Форма порожня.", "error"); return; }

        const newSlip = { id: monthId, month: monthIdx + 1, year: Number(year), monthName: MONTH_NAMES[monthIdx], accruals: cleanedAccruals, deductions: cleanedDeductions };
        
        let updatedData = dbData.filter(d => d.id !== newSlip.id);
        if (editingPayslip && editingPayslip.id !== newSlip.id) updatedData = updatedData.filter(d => d.id !== editingPayslip.id);
        
        setDbData([...updatedData, newSlip]); setSelectedMonthId(newSlip.id);
        confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
        showToast("Збережено!", "success");
        setIsFormDirty(false); setEditingPayslip(null); handleTabChange('payslips', true);
      };

      return (
        <div className="max-w-3xl mx-auto space-y-6 pb-20">
          <div className="bg-white dark:bg-slate-800 p-6 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700">
            <h2 className="text-xl font-bold mb-4">{editingPayslip ? 'Редагування' : 'Додати розрахунковий лист'}</h2>
            <form onSubmit={handleFormSubmit} className="space-y-6">
              <div className="grid grid-cols-2 gap-4">
                <div>
                  <label className="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Місяць</label>
                  <CustomSelect value={monthIdx} onChange={v => { setMonthIdx(Number(v)); markDirty(); }} options={MONTH_NAMES.map((m, i) => ({ value: i, label: m }))} />
                </div>
                <div>
                  <label className="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Рік</label>
                  <input type="number" value={year} onChange={e => { setYear(e.target.value); markDirty(); }} className="w-full bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg p-2 font-mono outline-none focus:border-brand-500 text-sm" required />
                </div>
              </div>

              <div className="border border-profit-200 dark:border-profit-900/50 rounded-xl overflow-hidden">
                <div className="bg-profit-50 dark:bg-profit-900/10 p-4 flex justify-between items-center border-b border-profit-100 dark:border-profit-900/30">
                  <h3 className="font-bold text-profit-700 dark:text-profit-400">Нарахування</h3>
                  <button type="button" onClick={handleAddAccrual} className="text-sm text-profit-600 bg-white dark:bg-slate-800 px-3 py-1 rounded border border-profit-200 dark:border-profit-800 shadow-sm">+ Додати</button>
                </div>
                <div className="p-4 space-y-3 bg-white dark:bg-slate-800">
                  {accruals.map((item, idx) => (
                    <div key={item.id} className="flex gap-2 items-center">
                      <input type="text" placeholder="Назва" value={item.name} onChange={e => { const a = [...accruals]; a[idx].name = e.target.value; setAccruals(a); markDirty(); }} className="flex-1 border rounded p-2 text-sm bg-transparent border-slate-200 dark:border-slate-700 outline-none focus:border-profit-500" required />
                      <input type="number" step="0.01" placeholder="Сума" value={item.amount} onChange={e => { const a = [...accruals]; a[idx].amount = e.target.value; setAccruals(a); markDirty(); }} className="w-28 border rounded p-2 text-sm font-mono font-bold text-profit-600 bg-transparent border-slate-200 dark:border-slate-700 outline-none focus:border-profit-500" required />
                      <button type="button" onClick={() => removeAccrual(item.id)} className="text-slate-400 hover:text-loss-500 p-2"><IconTrash /></button>
                    </div>
                  ))}
                </div>
              </div>

              <div className="border border-loss-200 dark:border-loss-900/50 rounded-xl overflow-hidden">
                <div className="bg-loss-50 dark:bg-loss-900/10 p-4 flex justify-between items-center border-b border-loss-100 dark:border-loss-900/30">
                  <h3 className="font-bold text-loss-700 dark:text-loss-400">Утримання</h3>
                  <button type="button" onClick={handleAddDeduction} className="text-sm text-loss-600 bg-white dark:bg-slate-800 px-3 py-1 rounded border border-loss-200 dark:border-loss-800 shadow-sm">+ Додати</button>
                </div>
                <div className="p-4 space-y-3 bg-white dark:bg-slate-800">
                  {deductions.map((item, idx) => (
                    <div key={item.id} className="flex gap-2 items-center">
                      <input type="text" placeholder="Назва" value={item.name} onChange={e => { const a = [...deductions]; a[idx].name = e.target.value; setDeductions(a); markDirty(); }} className="flex-1 border rounded p-2 text-sm bg-transparent border-slate-200 dark:border-slate-700 outline-none focus:border-loss-500" required />
                      <input type="number" step="0.01" placeholder="Сума" value={item.amount} onChange={e => { const a = [...deductions]; a[idx].amount = e.target.value; setDeductions(a); markDirty(); }} className="w-28 border rounded p-2 text-sm font-mono font-bold text-loss-600 bg-transparent border-slate-200 dark:border-slate-700 outline-none focus:border-loss-500" required />
                      <button type="button" onClick={() => removeDeduction(item.id)} className="text-slate-400 hover:text-loss-500 p-2"><IconTrash /></button>
                    </div>
                  ))}
                </div>
              </div>

              <div className="bg-slate-50 dark:bg-slate-900/50 p-4 rounded-xl border border-slate-200 dark:border-slate-700 flex justify-between items-center sticky bottom-4 z-10 shadow-lg">
                <span className="font-bold">До виплати:</span>
                <span className={`text-xl font-bold font-mono ${currentNetCents < 0 ? 'text-loss-500' : 'text-slate-900 dark:text-white'}`}>{formatCurrency(fromCents(currentNetCents))}</span>
                <button type="submit" className="bg-brand-600 text-white px-6 py-2 rounded-lg font-bold hover:bg-brand-700 transition shadow-sm">Зберегти</button>
              </div>
            </form>
          </div>
        </div>
      );
    };

    const Layout = () => {
      const { theme, toggleTheme, isPrivateMode, togglePrivateMode, activeTab, handleTabChange, dbData, generateAndDownloadJSONFile, showToast, isMobileMenuOpen, setIsMobileMenuOpen } = useSalaryContext();
      
      return (
        <div className="h-screen flex flex-col md:flex-row bg-slate-100 dark:bg-slate-900 text-slate-900 dark:text-slate-100 font-sans">
          
          <div className="md:hidden bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 px-4 py-3 flex items-center justify-between z-30">
            <div className="flex items-center space-x-2 text-brand-600"><IconWallet /><h1 className="text-lg font-bold text-slate-900 dark:text-white">SalaryHub</h1></div>
            <div className="flex items-center gap-2">
                <button onClick={toggleTheme} className="p-2 text-slate-500">{theme === 'dark' ? <IconSun /> : <IconMoon />}</button>
                <button onClick={() => setIsMobileMenuOpen(!isMobileMenuOpen)} className="p-2 text-slate-500"><IconMenu /></button>
            </div>
          </div>

          {isMobileMenuOpen && <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-40 md:hidden" onClick={() => setIsMobileMenuOpen(false)}></div>}

          <aside className={`fixed inset-y-0 left-0 z-50 w-64 bg-white dark:bg-slate-800 border-r border-slate-200 dark:border-slate-700 flex flex-col transform transition-transform duration-300 ease-in-out md:relative md:translate-x-0 ${isMobileMenuOpen ? 'translate-x-0' : '-translate-x-full'}`}>
            <div className="p-6 flex items-center justify-between gap-2">
              <div className="flex items-center gap-2 text-brand-600"><IconWallet /><h1 className="text-xl font-bold text-slate-900 dark:text-white">SalaryHub</h1></div>
              <div className="hidden md:flex"><button onClick={toggleTheme} className="p-2 text-slate-400 hover:text-brand-600">{theme === 'dark' ? <IconSun /> : <IconMoon />}</button></div>
            </div>
            
            <nav className="flex-1 px-4 space-y-2 mt-4">
              <button onClick={() => handleTabChange('dashboard')} className={`w-full flex items-center gap-3 px-4 py-3 rounded-lg font-medium transition-colors ${activeTab === 'dashboard' ? 'bg-brand-50 text-brand-600 dark:bg-brand-900/30 dark:text-brand-400' : 'text-slate-600 hover:bg-slate-50 dark:text-slate-400 dark:hover:bg-slate-700/50'}`}>
                <IconActivity /> Головна
              </button>
              <button onClick={() => handleTabChange('payslips')} disabled={dbData.length === 0} className={`w-full flex items-center gap-3 px-4 py-3 rounded-lg font-medium transition-colors ${activeTab === 'payslips' ? 'bg-brand-50 text-brand-600 dark:bg-brand-900/30 dark:text-brand-400' : 'text-slate-600 hover:bg-slate-50 dark:text-slate-400 dark:hover:bg-slate-700/50 disabled:opacity-50'}`}>
                <IconFileText /> Листи
              </button>
              <button onClick={() => handleTabChange('add')} className={`w-full flex items-center gap-3 px-4 py-3 rounded-lg font-medium transition-colors ${activeTab === 'add' ? 'bg-brand-600 text-white shadow-md' : 'text-slate-600 bg-slate-50 hover:bg-slate-100 dark:text-slate-300 dark:bg-slate-900/50 dark:hover:bg-slate-700/80'}`}>
                <IconPlus /> Додати дані
              </button>
            </nav>

            <div className="p-4 border-t border-slate-200 dark:border-slate-700">
               <button onClick={togglePrivateMode} className="w-full flex items-center gap-3 px-4 py-2.5 rounded-lg text-sm text-slate-600 hover:bg-slate-50 dark:text-slate-400 dark:hover:bg-slate-700/50">
                 {isPrivateMode ? <IconEyeOff /> : <IconEye />} Приватний режим
               </button>
               <button onClick={() => generateAndDownloadJSONFile(dbData)} disabled={dbData.length===0} className="w-full flex items-center gap-3 px-4 py-2.5 rounded-lg text-sm text-slate-600 hover:bg-slate-50 dark:text-slate-400 dark:hover:bg-slate-700/50 disabled:opacity-50 mt-1">
                 <IconDownload /> Експорт JSON
               </button>
            </div>
          </aside>

          <main className="flex-1 p-4 md:p-8 overflow-y-auto no-scrollbar relative">
            {activeTab === 'dashboard' && <DashboardView />}
            {activeTab === 'payslips' && <PayslipView />}
            {activeTab === 'add' && <AddPayslipView />}
          </main>
        </div>
      );
    };

    const App = () => (
      <SalaryProvider><Layout /></SalaryProvider>
    );
    
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
